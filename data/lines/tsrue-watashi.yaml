fare:
  - 無料
ships:
  - 一丁櫓和船タイプの木造船（手漕ぎ・2003年新造）
notes:
  - 萩市道浜崎鶴江線（市道扱いの渡船）。運航主体は萩市土木課
  - 随時運航（呼び出し式）・所要約1分。浜崎側乗り場の呼び鈴を押すと対岸（鶴江側）から船頭が迎えに来る。鶴江側から乗る場合は待合所付近の船頭員に声掛け
  - "運航時間帯: 7:00〜11:00、13:00〜15:00、16:00〜18:00"
  - "運休: 年中無休が原則。天候不順（強風等）時と年1回の船舶整備期間（ドック運休）のみ運休。天候不順時は鶴江側に赤旗を掲げて周知"
  - 2026年の船舶整備による運休は1月12日〜2月10日（運休の周知は約1ヶ月前）
  - 乗船料無料。安全のため救命胴衣を着用。未就学児は保護者同伴。電動自転車・団体利用は不可
  - "問い合わせ: 萩市土木課維持第1係 TEL 0838-25-3544"
