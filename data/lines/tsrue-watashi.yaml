ships:
  - 一丁櫓和船タイプの木造船（手漕ぎ・2003年新造）
notes:
  - 萩市道浜崎鶴江線（市道扱いの渡船）。運航主体は萩市土木課
  - 随時運航（呼び出し式）・所要約1分。浜崎側乗り場の呼び鈴を押すと対岸（鶴江側）から船頭が迎えに来る
  - "運航時間帯: 7:00〜11:00、13:00〜15:00、16:00〜18:00"
  - "運休日: 毎月第1・第3日曜日（船点検日）、例年2月中旬の約2週間（船体補修）。河川増水・強風など悪天候時は臨時運休"
  - 2026年の船体補修運休は1月12日〜2月10日
  - 乗船料無料。安全のため救命胴衣を着用。未就学児は保護者同伴。電動自転車は乗船不可
  - "問い合わせ: 萩市土木課維持第1係 TEL 0838-25-3544"
