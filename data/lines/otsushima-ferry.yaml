  - https://www.city.shunan.lg.jp/soshiki/102/3711.html
  - http://www.ccsnet.ne.jp/~jyunkou/
  - http://www.ccsnet.ne.jp/~jyunkou/link/untin/untin.html
  - http://www.ccsnet.ne.jp/~jyunkou/link/jikoku/jikoku.html
ships:
  - フェリー新大津島
  - 鼓海II
  - 金比羅丸（代替船）
fare:
  - "旅客（片道 大人 / 小人）"
  - "徳山〜大津島（本浦・馬島・刈尾・瀬戸浜 各港）: 720円 / 360円"
  - "本浦〜馬島: 520円 / 260円"
  - "本浦〜刈尾: 440円 / 220円"
  - "本浦〜瀬戸浜: 340円 / 170円"
  - "馬島〜刈尾: 280円 / 140円"
  - "馬島〜瀬戸浜: 380円 / 190円"
  - "刈尾〜瀬戸浜: 170円 / 90円"
  - "往復券（徳山〜大津島 各港）: 大人 1,440円 / 小人 720円（有効2日間）"
  - "回数券（徳山〜大津島 各港、片道11回分）: 大人 7,200円（有効2か月）"
  - "団体運賃（15名以上、徳山〜大津島 各港）: 大人 650円 / 小人 330円（通常 720円 / 360円）"
  - "身体障がい者手帳（第1種）・療育手帳（第1種A）・精神障がい者保健福祉手帳（1級）の交付を受けている方とその介護者1名は旅客運賃5割引"
  - "自動車航送（片道、事前予約制）: 3m未満 3,080円 / 3〜4m 3,550円 / 4〜5m 4,530円 / 5〜6m 5,920円 / 6〜7m 7,620円 / 7〜8m 9,120円 / 8〜9m 10,750円 / 9〜10m 12,390円 / 10m以上 12,390円＋1m毎1,640円加算"
  - "二輪（片道）: 自転車 280円 / 原付・125cc以下 570円 / 750cc未満 850円 / 750cc以上 1,130円"
  - "小荷物（3辺合計2m以内、30kg以下）: 10kg以下150円 / 20kg以下310円 / 30kg以下470円"
notes:
  - "運航: 大津島巡航株式会社（周南市築港町9-1）"
  - "電話: 0834-21-7749 / FAX 0834-22-3316"
  - ダイヤは通常期（1月4日〜12月31日）と正月期（1月1日〜1月3日）で異なる
  - 回数券は島内各港間（本浦・馬島・刈尾・瀬戸浜相互）にも設定あり（片道10回分の料金で11回乗船可）
  - 定期ドック入り（鼓海II / フェリー新大津島）の際は代替船「金比羅丸」で運航し、ダイヤが変更となる（時期はホームページで告知）
  - 自動車・バイクの航送は事前予約制（1か月前から受付）。フェリーがドック入り中は自動車・バイクの運搬不可
  - 2025年4月1日より全船禁煙
  - 運航状況は大津島巡航ホームページ・X（旧Twitter）@Ozshima_jyunkou で確認
