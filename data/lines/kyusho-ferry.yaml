name: 九商フェリー
route: 熊本〜島原
color: "#d92691"
source:
  - https://www.kumamotoferry.co.jp/timefare/
fare:
  - 往復券購入で復路1割引（有効期限は購入日から7日間）、ただしGW・お盆・シルバーウィーク・年末年始は往復券販売停止
  - 旅客運賃（大人片道）1,500円、（小人片道）750円
notes:
  - 所要時間は天候等により前後する場合あり
  - 乗用車利用の場合は出航30分前までに乗船手続きを完了のこと
  - 7便目は4月〜12月の土日祝のみ運航
  - 島原発熊本行きは9月〜5月の間、熊本港周辺海面作業の安全確保のため減速し10分程遅延することがある
