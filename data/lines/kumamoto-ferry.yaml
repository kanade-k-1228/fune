  - 中学生・高校生・大学生は15名以上の団体で5割引
  - 身体障害者手帳・療育手帳（知的障害者福祉手帳）・精神障害者保健福祉手帳保持者は本人・介護人（1名まで）ともに5割引
notes:
  - 7便は4〜12月の土日祝のみ運航
  - 所要時間 約30分
  - 予約センター 0957-63-8008（8:30〜17:50）
  - 熊本港 096-311-4100
  - 島原外港 0957-65-0701
  - 乗用車のWEB予約は乗船日の1ヶ月前から出航3時間前まで（徒歩旅客は予約不要、出航10分前までに乗船券購入）
  - 往復券（購入日から7日間有効・復路1割引）は2026年7月17日をもって販売終了
  - 2026年7月18日付で運賃改定（大人1,500→1,600円、小人750→800円、軽自動車3,800→4,200円 等）
