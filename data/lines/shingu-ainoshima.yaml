fare:
  - 大人 片道 480円 / 小児（小学生以下）片道 240円
  - 同伴する大人 1 人につき未就学児 1 人は無料
  - 回数券（11枚綴り・3か月有効）：一般 4,800円 / 小児 2,400円
  - 団体割引（15人以上）：一般・小児 1割引 / 学生（中・高・大）3割引
  - 通勤定期：1か月 17,280円 / 3か月 49,250円 / 6か月 93,320円
  - 通学定期：1か月 11,520円 / 3か月 32,840円 / 6か月 62,210円
  - 身体・療育・精神障害者手帳所持者および満70歳以上の新宮町内在住者は役場での手続きで無料券交付
notes:
  - 所要時間：約20分（航路約7.5km）
  - 定員 150人（荒天時はデッキ利用制限のため 80 人）
  - 波浪等による欠航は、相島発時刻の30分前に決定
  - 通常ダイヤ：3月1日〜10月31日 / 冬季ダイヤ：11月1日〜2月末日
  - 乗船券は新宮港発は新宮渡船待合所、相島港発は相島渡船待合所で購入
  - 問合せ：新宮町役場 産業振興課 092-962-0238 / 相島渡船待合所 092-963-0304
