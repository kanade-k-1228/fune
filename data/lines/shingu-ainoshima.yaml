name: 新宮町営
route: 新宮〜相島
color: "#d926b3"
source:
  - https://www.town.shingu.fukuoka.jp/soshiki/sangyo_shinko/8/1/2/1844.html
  - https://www.town.shingu.fukuoka.jp/soshiki/sangyo_shinko/8/1/2/1833.html
