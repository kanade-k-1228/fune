notes:
  - 所要時間 約50分
  - 夏期（3〜10月）と冬期（11〜2月）でダイヤが異なる
  - 夏期は平日と土日祝でダイヤが異なる（土日祝は5便、平日は4便）
  - 山川営業所 0993-34-0012（07:30〜17:00）
  - 根占営業所 0994-24-2531（08:00〜17:00）
  - 事前予約を除き先着順乗船。15名以上の団体は乗船日の3ヵ月前から予約可
  - 2026年11月30日(月)からドック入りのため運休予定（運航再開日は未定、公式サイトで要確認）
  - 2026年9月19日(土)〜23日(水)のシルバーウィーク期間は繁忙期のため一般車両の事前予約不可（先着順のみ）
