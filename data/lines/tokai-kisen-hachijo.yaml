  - 2026年7月1日より島しょ在住者割引の割引率を改定（大型客船 40%→35%、高速ジェット船 35%→30%）
  - 2026年4月1日より運賃及び料金の適用方を改定（特1等和室のルームチャージを2027年3月31日まで収受せず。5/1〜5/6・7/17〜9/23は除く）
  - 運賃表は月別発行で燃料油価格変動調整金により変動するため、上記運賃の適用月は要確認
