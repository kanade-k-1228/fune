fare:
  - 周遊船（雅・ツウィンビー）大人（中学生以上）1,800円
  - 周遊船（雅・ツウィンビー）小人（小学生以下）900円
  - 神社連絡船（宇賀丸）大人（中学生以上）1,000円
  - 神社連絡船（宇賀丸）小人（小学生以下）500円
  - 高速周遊船（アース、貸切予約制、定員6名まで）10,000円
