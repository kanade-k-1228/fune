  - 障害者手帳保持者は50%割引
  - ペット乗船料金 300円
notes:
  - 運航期間：4月下旬〜11月中旬（季節運航、冬期休業）
  - 周遊船：乗船場から出発し、琵琶島（宇賀神社）に停泊後に乗船場へ戻る周遊コース（所要約50分）
  - 神社連絡船（宇賀丸）：宇賀神社への往復便（片道約5分）。出港時刻 10:30/11:00、12:00/12:30、13:30/14:00、15:00
  - 高速周遊船（アース）は貸切予約制（随時運航、定員6名まで）
  - 欠航条件：風速12m/s以上、波高0.5m以上、視程300m以下、水位1.5m以下
  - 連絡先：026-258-2505（野尻湖定期船会社）
