fare:
  - 大人 片道 1,850円 / 往復 3,590円（中学生以上）
  - 小人 片道 950円 / 往復 1,840円（小学生）
  - 障がい者割引 片道 1,270円 / 往復 2,540円（片道料金約50％OFF、燃料調整金は割引対象外）
  - 幼児（未就学児）は大人1名につき1名膝上無料、座席利用時は小人料金
  - 燃料油価格変動調整金を含む（燃料価格により変更の可能性あり）
notes:
  - TEL 0980-83-0055（営業時間 6:00〜19:00、台風時を除く）
  - 所要時間 約25〜30分
  - 全席自由席
  - 運航会社は安栄観光（八重山観光フェリーとは2020年10月以降は別運航・共通乗船券廃止）
  - 海象悪化時は条件付き運航または欠航となる場合あり。最新の運航状況は公式サイト参照
  - 現行時刻表は2026年6月20日〜9月30日適用（期間外は公式サイトで要確認）
  - 竹富〜黒島の直行便は季節運航（2026年5月11日〜6月19日のみ）で本航路とは別ダイヤ
