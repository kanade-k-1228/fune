name: 琵琶湖汽船
route: 長浜〜竹生島〜今津
color: "#26d988"
source:
  - https://www.biwakokisen.co.jp/cruise/chikubu/price_time/
  - https://www.biwakokisen.co.jp/cruise/chikubu/
fare:
  - 長浜航路（長浜港⇔竹生島港 往復）乗船料：大人（中学生以上）3,800円・小学生1,900円、所要時間35分
  - 今津航路（今津港⇔竹生島港 往復）乗船料：大人（中学生以上）3,400円・小学生1,700円、所要時間25〜30分
  - びわ湖横断航路（今津港⇒竹生島⇒長浜港または長浜港⇒竹生島⇒今津港）乗船料：大人（中学生以上）3,600円・小学生1,800円
  - 竹生島上陸時に入島料が必要：大人（中学生以上）600円・小人300円
  - 15名以上の団体は乗船料10％割引
  - 未就学児は大人1名につき1名乗船料無料（2名の場合は小学生料金1名分が必要、ただし15名以上の団体利用を除く）
notes:
  - 予約・問い合わせ：琵琶湖汽船予約センター 0570-052-105（受付時間 9:00〜17:00）
  - 所要時間：長浜港〜竹生島 約35分、今津港〜竹生島 約25〜30分
  - 強風・悪天候時は運航変更あり
  - 通常期間（長浜航路）：2026年4月1日〜4月24日、12月26日〜2027年1月3日、3月7日〜3月31日の毎日運航、および2026年4月27日〜8月7日・8月17日〜12月4日の平日運航
  - 繁忙期間（長浜航路8便）：2026年4月25日〜12月6日の土日祝運航、ただし8月8日〜8月16日は毎日運航。⑧便は2026年11月28日〜29日、12月5日〜6日を除く
  - 冬季期間（長浜航路2便）：2026年12月7日〜12月25日および2027年1月4日〜3月5日の毎日運航
  - 冬季期間（今津航路2便）：2026年12月7日〜12月25日の土日および2027年1月4日〜2月28日の土日祝運航
  - 長浜航路通常期⑤便は2026年11月24日〜12月6日、12月26日〜2027年1月3日は運休
  - 今津航路⑤便は2026年4月25日〜12月6日、12月26日〜2027年1月3日のみ毎日運航
  - びわ湖横断航路⑤便は2026年4月25日〜11月23日のみ運航
  - びわ湖大花火大会開催日（大津市開催）は今津航路・長浜航路ともに午後便を運休
  - 3月6日は「びわ湖開き」のため運航ダイヤを変更して運航（長浜航路は通常期ダイヤにて運航予定）
