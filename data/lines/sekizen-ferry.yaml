name: 今治市営せきぜん渡船「第二せきぜん・とびしま」
route: 今治〜宗方〜大下〜小大下〜岡村
color: "#4c26d9"
source:
  - https://www.city.imabari.ehime.jp/kotsus/tosen/sekizen/
fare:
  - 大人 岡村/小大下/大下/宗方〜今治 870円（宗方〜今治は760円）／小児半額
  - 大人 岡村〜小大下 150円／岡村〜大下 200円／岡村〜宗方 420円
  - 大人 小大下〜大下 150円／小大下〜宗方 370円／大下〜宗方 220円
  - 往復券（今治のみ）大人 1,660円（宗方〜今治は1,450円）／小児 840円（宗方〜今治は730円）
  - 自転車 岡村/小大下/大下/宗方〜今治 190円／島間 150円
  - 原付 今治連絡 380円／島間 300円
  - 自動二輪 751cc未満 今治連絡 570円／島間 440円
  - 自動二輪 751cc以上 今治連絡 750円／島間 590円
  - 車両（今治連絡）3m未満 2,100円／3m以上4m未満 2,830円／4m以上5m未満 3,980円／5m以上6m未満 5,350円（運転手1名分の運賃を含む）
  - 小児半額／障害者手帳所持者半額／15名以上団体1割引（学生団体は3割引）／回数券（11回分で1回分割引）
notes:
  - フェリー「第二せきぜん」は、船員不足に伴い令和8年4月1日から当面の間、毎週月曜日・木曜日を全便運休
  - 旅客船「とびしま」は通常運航
  - 毎月第2火曜日・第4火曜日・第4水曜日は危険物運送便（旅客・車両も乗船可能だが旅客は運転手含め25人まで）
  - 第2火曜日の危険物便は12月〜4月の期間運航
  - 予約不要・先着順乗船
  - 岡村港務所：0897-88-2252 / 今治港務所：0898-32-0531
  - 関前支所住民サービス課：0897-88-2111
ships:
  - 第二せきぜん（フェリー、旅客定員135名、乗用車10台）
  - とびしま（旅客船、旅客定員40名）
