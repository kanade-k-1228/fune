fare:
  - 2等大人 3,880円（2026年8月、燃料油価格変動調整金により毎月変動）
  - 2等小児 1,940円（2026年8月）
  - 青ヶ島住民は片道3割5分引、学生2割引、障害者5割引、団体（15名以上）割引あり
notes:
  - 案内ダイヤル（青ヶ島代理店）04996-9-0033
  - 八丈島代理店（八丈マリンサービス）04996-2-1211
  - 運航決定は当日朝7時。村内放送・案内ダイヤルで確認
  - 予約不要。乗船受付時間内に乗船券購入と乗船手続きを済ませること
  - 毎週日曜・木曜は運休（木曜は芝浦揚積作業のため）
  - 上記のほか、水曜日を中心に不定期の運休日がある（運航カレンダーで「辰巳」表示の日）。最新の運休日は公式運航カレンダーで確認
  - 八丈島の出船港は八重根漁港と底土港の2か所。当日の案内を必ず確認
  - 所要時間 約3時間（距離81km）
  - 青ヶ島三宝港は風浪・潮流の影響を受けやすく、ダイヤどおりの運航ができないことがあり、就航率は50〜60%
  - 気象海象状況により欠航した場合、必要に応じて予備日に臨時便を運航することがある
