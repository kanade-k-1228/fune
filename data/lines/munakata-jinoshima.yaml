fare:
  - 神湊〜泊：大人 380円／小児 190円
  - 泊〜白浜：大人 130円／小児 70円
  - 神湊〜白浜：大人 410円／小児 210円
  - 大人1人につき就学前児童1人無料
  - 自動車航送（フェリー便のみ・要予約）：3m未満 2,170円／3〜4m 2,690円／4〜5m 3,520円／5〜6m 4,100円（旅客運賃1名分込み・片道）
notes:
  - フェリー便は第2・第4水曜日のみ1便運航（泊港への停泊なし）
  - お支払いは現金のみ
  - 乗船券は神湊漁港ターミナル内の自動券売機で購入
  - 自動車航送は大島港旅客ターミナル（0940-72-2535、7:00〜17:00）で要予約。出航15分前までに受付
  - 運航状況は「九州のりものinfo.com」で確認可能
