name: 瀬戸内シーライン
route: 呉〜小用
color: "#26d978"
source:
  - https://setonaikaikisen.co.jp/kouro/highspeedship3/
  - https://setonaikaikisen.co.jp/highspeedship3/wp-content/uploads/sites/7/2022/08/20260901_kure-koyou_unchin.pdf
  - https://setonaikaikisen.co.jp/highspeedship3/wp-content/uploads/sites/7/2022/08/202609_kurekoyoudock.pdf
fare:
  - 旅客運賃（片道・税込）：フェリー大人450円・小人230円、高速船大人650円・小人330円
  - 回数券（11枚綴り）：フェリー4,500円、高速船6,500円
  - 車両運賃（運転者1名の旅客運賃込み）：軽自動車・4m未満1,000円、6m未満1,500円、9m未満3,800円、12m未満5,800円
notes:
  - フ＝カーフェリー（車両乗船可）、高＝高速船（旅客のみ）
  - 呉港9:25・11:30〜16:50発便（10:15発便不可）／小用港10:40〜16:25発便のみ小荷物取扱（フェリー便のみ、高速船不可）
  - 営業距離：呉港〜小用港 6.1km
  - 2026年9月1日運賃改定予定（フェリー旅客運賃 大人450円→490円・小人230円→250円、高速船大人650円→690円・小人330円→350円、車両運賃・回数券・定期券も改定）
  - フェリー「古鷹」は船舶エプロン（車両乗降口）調整のため2026年9月16日まで7m以上の車両は乗船不可
  - 2026年9月5日〜9月16日はフェリードック期間のため高速船代船「はやしお」による全便運航（車両航送不可）
ships:
