name: JR西日本宮島フェリー
route: 宮島口〜宮島
color: "#5626d9"
source:
  - https://jr-miyajimaferry.co.jp/timetable/
  - https://jr-miyajimaferry.co.jp/fare/
  - https://jr-miyajimaferry.co.jp/
fare:
  - 大人 片道 200円 / 往復 400円
  - 小児（6〜12才未満） 片道 100円 / 往復 200円
  - 未就学児 有料人員1名につき2名まで無賃
  - 自転車 100円
  - バイク 125cc以下 200円 / 125〜750cc 300円 / 750cc超 400円
  - 自動車航送（3m未満）800円
  - 自動車航送（3〜4m未満）1,250円
  - 自動車航送（4〜5m未満）1,700円
  - 自動車航送（5〜6m未満）2,250円
  - 通勤定期（大人）4,600円/月、13,110円/3ヶ月、24,200円/6ヶ月
  - 別途宮島訪問税 100円 / 人（宮島上陸時、未就学児等は免除）
notes:
  - 所要時間 約10分
  - 宮島口発 9:10〜16:10 の便は大鳥居便として運航（潮位により大鳥居に近づけない場合あり）
  - 多客時は乗船便の変更を依頼される場合あり、臨時便を運航することがある
  - 全国相互利用交通系ICカード（ICOCA・Suica 等）利用可
  - TEL 0829-56-2045（受付 9:00〜12:00 / 13:00〜17:00、土日可）
  - 忘れ物問合せ 0829-44-0035
  - 多客ダイヤ・年末年始ダイヤあり（大晦日は終夜運航）
ships:
  - みやじま丸
  - ななうら丸
  - みせん丸
