fare:
  - 大人 片道520円・往復（島発のみ）990円
  - 子供 片道260円・往復（島発のみ）500円
  - 国境離島島民割引 大人200円・子供100円
  - 定期（大人）18,720円
notes:
  - 通常1日2往復（小値賀発7:25・14:30、野崎発8:05・15:10）
  - 日曜を中心に運休日あり（月により変動）。詳細は町公式サイトの運航カレンダーPDF参照
  - 4〜5月・7〜10月の土日祝（振替休日含む、お盆8/13〜15含む）は野崎直行の増便4便を運航（小値賀11:10発→野崎11:30着/11:35発→小値賀11:55着、六島には寄港せず）。一部日曜日は「日曜日特別ダイヤ」で運航（詳細は町公式サイトの運航カレンダーPDF参照）
  - 海況により六島港に寄港しないことがある。午前中に野崎島へ渡った後、天候悪化で午後便が欠航し日帰りできなくなる場合あり
  - 連絡先：はまゆう 090-4984-8025 / 小値賀町役場 未来創造課 0959-56-3111
