fare:
  - 柳井⇔三津浜 adult::oneway::5,000円 / round::9,500円
  - 柳井⇔三津浜 child::oneway::2,500円 / round::4,750円
  - 柳井⇔伊保田 adult::oneway::1,640円 / round::3,120円
  - 柳井⇔伊保田 child::oneway::820円 / round::1,560円
  - 伊保田⇔三津浜 adult::oneway::2,570円 / round::4,890円
  - 伊保田⇔三津浜 child::oneway::1,290円 / round::2,460円
  - 往復運賃は出発日を含めて7日間有効。
  - 乳幼児（1〜6歳未満）は無賃。中学生以上が大人。
  - 車両運賃は別途設定（運転手1名分の旅客運賃込み）。
notes:
  - 所要時間 柳井〜三津浜 約2時間30分（伊保田寄港便は約2時間50分）。
  - 予約・運航情報は防予フェリー予約センター（柳井 0820-22-3311 / 松山 089-951-3509 / 伊保田 0820-75-1575）。
  - 荒天時は当日欠航判断となる場合あり。最新の運航状況は予約センターまで。
  - 網掛け便（伊保田寄港便）は周防大島松山フェリーが運航。
  - 柳井 1:00・2:00 発および三津浜 3:35・4:50 発の深夜便は日曜・月曜運休。
  - 柳井 22:10 発および三津浜 23:10 発の夜行便は土曜・日曜運休。
