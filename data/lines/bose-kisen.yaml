fare:
  - 大人片道 1,300円 / 往復 2,600円（姫路〜坊勢・姫路〜男鹿）
  - 小人片道 650円 / 往復 1,300円（姫路〜坊勢・姫路〜男鹿）
  - 大人片道 650円 / 小人片道 330円（坊勢〜男鹿）
  - 大人回数券 11枚 13,000円（姫路〜坊勢・姫路〜男鹿）
  - 自転車 500円（電動自転車は積込不可）
  - ペット 片道 300円（指定ゲージ使用時）
notes:
  - 坊勢発14:44の便は臨時便として男鹿島に寄港する（平日・土日祝共通）
  - 姫路本社 TEL 079-234-1173 / FAX 079-234-1182
  - 坊勢営業所 TEL 080-2436-0065
  - 大人は中学生以上、小人は小学生
  - 2026年7月1日より平日ダイヤの最終便が坊勢発・姫路発ともに早まった（土日祝・夏季繁忙期は従来通り12便）
