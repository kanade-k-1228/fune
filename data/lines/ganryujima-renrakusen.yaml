fare:
  - 往復 大人900円 / 小児450円
  - 15名以上の団体は10%割引
  - 障害者割引50%引（適用区分あり）
  - トライアングルフリーパス（関門連絡船＋巌流島航路1日乗り放題）大人1,000円 / 小児500円
