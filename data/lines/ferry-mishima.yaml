fare:
  - 一等片道 大人 7,330円 / 小人 3,660円
  - 二等片道 大人 3,660円 / 小人 1,830円
  - 有人国境離島割引（住民・準住民） 二等片道 大人 2,290円 / 小人 1,150円
  - 学生割引 二等片道 2,930円（学生割引証持参）
  - 自動車航送 3m未満 15,540円〜（運転手の二等運賃を含む）
  - 自転車 780円 / 原付125cc未満 1,780円
notes:
  - 月別ダイヤで1泊2日と日帰りパターンを混在運航（鹿児島9:30発／日帰り19:50着・1泊翌日14:05着）
  - 鹿児島〜竹島約3時間／竹島〜硫黄島約40分／硫黄島〜大里約70分／大里〜片泊約30分
  - 黒島は大里・片泊2港に寄港
  - 鹿児島発乗船券販売 7:00〜9:20（みしま待合所）
  - 当日出港可否は午前6時30分以降、三島村役場(099-222-3141)の自動音声案内で確認
  - 099-813-7751（みしま待合所）／099-222-3141（三島村役場 船舶課）
  - 枕崎航海は休止中
  - 令和8年6月より、船員の休日確保のため月1〜2回程度、金曜日の日帰り片道便を計画運休（具体的な日程は運航情報ページで随時案内）
