fare:
  - 沼津港〜大瀬崎 片道：大人 1,500円、小人 750円（3歳〜小学生）
  - 大瀬崎の各施設利用者向け特別割引：大人 1,400円、小人 700円（乗船券購入時に申請）
  - 所要時間：約35分
notes:
  - 【運休中】2026年夏季は運休（本航路 沼津港〜大瀬崎）。2025年10月5日の沼津港内衝突事故を受け、安全対策実施のため沼津港遊覧クルーズ（周遊コース・別便）のみ2026年7月18日に段階的運航再開。大瀬崎便・三津遊覧クルーズは2026年8月時点でも運休継続中（公式サイトより）
  - 夏季限定定期便（例年7月中旬〜8月下旬）。2025年は7/19〜8/24運航（事故発生前の実績、参考情報）
  - 1日3〜4便運航、AダイヤとBダイヤの2パターンあり（日により異なる）
  - 通常はBダイヤで運航、特定日（夏休み繁忙期等）にAダイヤ適用（2025年実績：8/18〜22がAダイヤ）
  - 7月下旬には沼津港〜大瀬崎〜戸田を結ぶ特別便も例年運航（2025年は7/19〜21）
  - 乗船券販売：沼津港側はひものセンター前、大瀬崎側は大瀬桟橋
  - 問い合わせ：千鳥観光汽船 055-943-2221 / 沼津港ひものセンター 055-962-7537
