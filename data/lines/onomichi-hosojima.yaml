fare:
  - 旅客 大人 150円 / 小人 80円
  - 自転車付 大人 230円 / 小人 160円
  - 原付自転車付 大人 320円 / 小人 250円
  - 二輪自動車付 (750cc未満) 大人 410円 / 小人 340円
  - 二輪自動車付 (750cc以上) 大人 500円 / 小人 430円
  - 自動車 3m未満 590円 / 3-4m 810円 / 4-5m 1,010円 / 5-6m 1,260円 (運転者1名の旅客運賃含む)
  - 回数乗船券 旅客11枚綴 1,500円
  - 定期乗船券 (1か月) 普通 歩行者 4,500円 / 自転車付 6,900円
  - 65歳以上・身体障害者手帳所持者は5割引
notes:
  - 所要約15分
  - 平日8往復 / 日祝5往復 (正月3が日は日祝ダイヤ)
  - 日祝は2便・5便・8便が運休
  - 問合せ 尾道市因島総合支所 施設管理課 TEL 0845-26-6202
  - 令和3年10月1日運賃改正
