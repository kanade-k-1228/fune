notes:
  - 予約センター 0570-002-921（9:00〜17:45、土日祝を除く）
  - 2026年9月30日出港便まで：北行（敦賀発）は毎週月曜日運航、南行（苫小牧東港発）は毎週土曜日運航、所要時間 約31時間15分
  - 2026年10月1日出港便より：北行（敦賀発）は火・木・日曜日運航、南行（苫小牧東港発）は火・木・土曜日運航、所要時間 約46時間15分
  - 2026年10月1日ダイヤ改正後、敦賀→秋田・苫小牧東港まで乗船の場合は新潟で一時下船可（新潟停泊 約16時間半）
  - 2026年10月1日出港の北行き便は、船舶繰りのため新潟発着で運航（敦賀発なし）
  - 2026年10月1日より敦賀発着の連絡バス運航開始：乗船時 JR敦賀駅16:00発→敦賀フェリーターミナル（18:30出港日のみ）、下船後 敦賀フェリーターミナル6:20発→JR敦賀駅（6:00入港日のみ）
  - 使用船舶 らいらっく / ゆうかり（旅客定員846名、18,229トン）
