name: 辰の島観光船
route: 壱岐島〜辰の島
color: "#d92648"
source:
  - https://iki-tatsunoshima.com/
  - https://www.ikikankou.com/spot/10277
fare:
  - adult::round::1,000円（渡船のみ）
  - child::round::500円（渡船のみ）
  - adult::2,000円（遊覧クルージング）
  - child::1,000円（遊覧クルージング）
  - adult::2,500円（遊覧＋上陸）
  - child::1,250円（遊覧＋上陸）
  - 未就学児は大人1名につき1名無料
notes:
  - 運航：勝本町漁業協同組合（JF勝本町観光案内所）
  - TEL 0920-42-2020（午前9時〜午後5時）
  - 所要時間：遊覧 約40分
  - 定員 60名／最少運行人員 3名
  - 冬期（12月〜3月）運休
  - 勝本港発 3便・7便は「迎えのみ」につき勝本港からの乗船不可（辰の島発のみ運航）
  - 夏休み期間（7/20〜8/31）はシャトル便追加で30分おき発着
  - 天候不良時は欠航あり、団体予約や連休は事前予約推奨
