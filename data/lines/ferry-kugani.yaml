fare:
  - 旅客運賃（フェリーくがに）：大人片道650円・往復1,240円、小人片道330円・往復630円、障がい者片道330円・往復660円、団体往復1,180円（片道なし）
  - 旅客運賃（高速船ニューくがに）：大人片道800円・往復1,530円、小人片道410円・往復790円、障がい者片道410円・往復820円、団体往復1,460円（片道なし）
  - 自動車航送運賃：3〜4m未満 片道5,000円・往復10,000円（事前予約必須、運転手1名無料）
  - 自転車片道200円・往復400円、原付自転車片道430円・往復860円、二輪自動車片道640円・往復1,280円
  - 団体割引：15名以上、小人は小学生、就学前小児は大人1名につき1名無料
notes:
  - フェリーくがに（約30分）と高速船ニューくがに（約15分）の2種類が運航。フェリーが高速船に変更される場合あり。問い合わせ先：(有)神谷観光
