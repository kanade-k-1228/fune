fare:
  - 大人 白水〜生野島 120円 / 生野島〜契島 180円 / 白水〜契島 290円（片道）
  - 小人 上記の半額
  - 自転車 50円
  - 原付自転車 100円
  - 自動二輪車 150〜210円（排気量により異なる）
  - 自動車 長さ2m以上 480〜1,600円ほか（超過分は1mごとに加算）
  - 身体・知的・精神障がい者は5割引
notes:
  - 1日7往復
  - 所要時間 白水〜生野島 約10分 / 生野島〜契島 約15分
  - 4便は危険物便となる場合あり
  - 毎月第一・第三水曜日は危険物便（旅客乗船不可、祝日・盆休・年末年始除く）
  - 1月1日〜3日は1・2・3・5・6便が運休（4・7便のみ運航）
  - 契島は私有地のため関係者以外上陸不可
  - 問合せ 大崎上島町建設課 0846-65-3124
