  - 2等 小児 鹿児島〜口之島・中之島 3,150円／諏訪之瀬島・平島・悪石島 3,570円／小宝島・宝島 4,090円／名瀬 6,090円
  - 2等 学割 鹿児島〜口之島・中之島 5,040円／諏訪之瀬島・平島・悪石島 5,720円／小宝島・宝島 6,540円／名瀬 9,740円
