notes:
  - 原則 週2便（月・金 鹿児島発 23:00 → 翌日 名瀬着 15:20、水・日 名瀬発 02:00 → 同日 鹿児島着 18:20）
  - 鹿児島〜名瀬 所要約 16 時間 20 分
  - 旅客券予約は乗船前月の15日から（鹿児島代理店 中川運輸 099-219-1191、受付 月〜金 8:30〜17:00／土 8:30〜12:00）
  - 鹿児島港 9:00〜12:00／13:00〜17:00／19:00〜22:30 乗船受付（予約者は21:00まで）
  - 十島村土木交通課 099-222-2103
  - 船内連絡 090-3022-4293
  - 7島めぐりツアー・レントゲン特別便・ボゼ特別便・マラソン特別便などの特別運航日あり（年間計画参照）
  - 荒天等で定期便が延期となった場合、水曜日に「水曜臨時便」で代替運航することがある（前便の運航状況を要確認）
  - 三島村（みしま航路）の代船として臨時運航することがあり、その際は十島村の各港には寄港しない（例 2026年9月17日・24日は三島村用船運航のため十島村各港に寄港せず）
