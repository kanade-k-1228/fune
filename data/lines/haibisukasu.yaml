notes:
  - カーフェリー貨客船
  - 1日1往復（夜行）
  - バイク10台まで先着順
  - ペット不可、食堂・シャワーなし
  - 所要時間 鹿児島〜種子島 約3時間40分、種子島〜屋久島 約2時間
  - 旅客予約不要、車両航送は電話予約必須
  - 鹿児島：099-261-7000
  - 種子島：0997-22-1355
  - 屋久島：0997-42-0140
  - 二輪・自転車利用時は別途旅客運賃が必要
fare:
  - 旅客2等 鹿児島〜種子島 大人 3,800円 / 小児 1,900円（片道）
  - 旅客2等 鹿児島〜屋久島 大人 3,900円 / 小児 2,000円（片道）
  - 旅客2等 種子島〜屋久島 大人 2,350円 / 小児 1,150円（片道）
  - 車両航送 鹿児島〜種子島 3M未満 12,400円 / 4M未満 15,200円 / 5M未満 18,800円 / 6M未満 23,200円（運転手1名2等運賃込・片道）
  - 車両航送 鹿児島〜屋久島 3M未満 13,000円 / 4M未満 17,900円 / 5M未満 23,400円 / 6M未満 33,600円（運転手1名2等運賃込・片道）
  - 車両航送 種子島〜屋久島 3M未満 7,700円 / 4M未満 9,200円 / 5M未満 10,200円 / 6M未満 12,400円（運転手1名2等運賃込・片道）
  - 二輪 鹿児島〜種子島 自転車 1,950円 / 原付 3,050円 / 〜125cc 3,650円 / 〜250cc 4,800円 / 〜750cc 5,800円 / 750cc以上 6,800円（片道）
  - 二輪 鹿児島〜屋久島 自転車 1,200円 / 原付 2,100円 / 〜125cc 2,150円 / 〜250cc 3,050円 / 〜750cc 3,050円 / 750cc以上 4,000円（片道）
  - 二輪 種子島〜屋久島 自転車 1,400円 / 原付 1,900円 / 〜125cc 2,050円 / 〜250cc 2,250円 / 〜750cc 2,450円 / 750cc以上 2,750円（片道）
