name: 丹後海陸交通
route: 宮津〜天橋立〜一の宮
color: "#ca26d9"
source:
  - https://www.tankai.jp/trip/amaboat/
  - https://www.tankai.jp/news/a_sightseeingboat/41213/
fare:
  - 天橋立〜一の宮 片道 大人800円・小児400円、往復 大人1,300円・小児650円
  - 宮津〜一の宮 片道 大人1,400円・小児700円、往復 大人2,200円・小児1,100円
  - 宮津〜天橋立 片道 大人600円・小児300円、往復 大人1,000円・小児500円
  - 幼児（小学生未満）：大人1名につき1名無賃、他小児運賃
  - ペット：無賃（ペット用バッグ又はケージに頭部まで入れること）
  - 障がい者割引：5割引（手帳の提示が必要）
notes:
  - 土日祝は特別コース（回旋橋・運河めぐり経由、22分）を追加運航：天橋立桟橋発
    10:45・11:45・12:45・13:45・14:45の5便。運航開始：2026年3月7日（土）〜。※GW等は別ダイヤで運航。
    2026年7月18日〜9月27日の土日祝は特別コースを運休（通常ダイヤで運航）
  - 2026年7月21日〜9月30日の平日は宮津〜天橋立〜一の宮間を2往復増便して運航（宮津発11:00・14:30、一の宮発10:30・14:00等）
  - 2026年8月10日〜8月16日、9月19日〜9月23日は別ダイヤで運航（詳細未公表、公式サイト参照）
  - 2026年8月29日・30日は天橋立ビーチサイドBAR開催に伴い、天橋立〜宮津間で夜間臨時便を運航
  - ◎印の便：3月1日〜10月31日運航
  - ◇印の便：4月1日〜9月30日運航
  - 運航中止基準：各桟橋で風速10m/s以上・波高0.8m以上・視程300m以下、当該海域で風速12m/s以上・波高1.2m以上・視程300m以下
  - 問い合わせ：天橋立桟橋 0772-22-2164、一の宮桟橋 0772-27-0023、宮津桟橋 0772-22-3231
