name: 四国汽船
route: 直島（宮浦）〜豊島（家浦）〜犬島
color: "#26d98f"
source:
  - https://shikokukisen.com/miyanoura-ieura-inujima/
  - https://shikokukisen.com/information/important/post-4288/
