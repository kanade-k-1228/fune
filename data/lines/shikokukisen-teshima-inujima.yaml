name: 四国汽船
route: 直島（宮浦）〜豊島（家浦）〜犬島
color: "#26d98f"
source:
  - https://www.shikokukisen.com/instant/#route04
  - https://www.shikokukisen.com/fare/
notes:
  - 高速旅客船のみ運航（自動車・自転車不可）
  - 3月1日〜11月30日：月・水・木・金・土・日曜・祝日は運航
  - 12月1日〜2月末日：月・金・土・日曜・祝日は運航
  - 豊島美術館または犬島精錬所美術館が休館の場合は、当該港に寄港しない
  - 両美術館が共に休館日の場合は運休
  - 祝日等で開館曜日が変更された場合は美術館の開館日に合わせて運航
  - 直島（宮浦）〜犬島の所要時間は約55分
  - 直島⇔犬島のチケットで豊島途中下船すると残区間は乗船不可
  - 支払いは現金のみ
  - 電話：087-892-3104（四国汽船 宮浦支店）
fare:
  - 直島（宮浦）⇔豊島（家浦） 大人 820円 / 小人 410円
  - 豊島（家浦）⇔犬島 大人 1,630円 / 小人 820円
  - 直島（宮浦）⇔犬島 大人 2,450円 / 小人 1,230円
  - 運賃は2026年2月1日改定
