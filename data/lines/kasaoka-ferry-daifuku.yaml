notes:
  - 笠岡側の発着は伏越港。北木島側は豊浦港と金風呂港に寄港。
  - 2023年12月31日に時刻改正。
  - 下り3便は豊浦港まで（着のみ・係船）、上り3便は豊浦港始発（発のみ・係船）。
  - チャーター便には第拾八大福丸が就航。
  - 連絡先 〒714-0082 岡山県笠岡市一番町5-18 / TEL 090-1684-6230 / FAX 0865-67-3233 / daifukumaru@kasaoka-ferry.com
fare:
  - 旅客運賃 笠岡⇔白石島・北木島 大人520円 / 小人260円
  - 旅客運賃 白石島⇔北木島 大人200円 / 小人100円
  - 小人運賃は小学生以下が対象
  - 車両航送（笠岡⇔白石島・北木島）3m未満1,800円 / 4m未満2,400円 / 5m未満3,000円 / 6m未満3,900円 / 7m未満4,600円 / 8m未満5,300円 / 9m未満6,100円 / 10m未満7,100円 / 11m未満8,000円 / 12m以上9,000円（以降1m毎+1,000円）
  - 車両航送（白石島⇔北木島）3m未満600円 / 4m未満800円 / 5m未満1,100円 / 6m未満1,300円 / 7m未満1,700円 / 8m未満2,000円 / 9m未満2,200円 / 10m未満2,400円 / 11m未満2,600円 / 12m以上3,000円（以降1m毎+500円）
  - 車両運賃は運転者1名分の旅客運賃を含む
  - 特殊手荷物（笠岡⇔島間 / 島間）自転車180円/100円、原付360円/200円、自動二輪750cc未満540円/300円、750cc以上720円/400円（旅客運賃が別途必要）
  - 回数券（11枚綴り）、15名以上の団体割引あり
  - 障害者割引：身体障害者第1種・知的障害者第1種・精神障害者1級のみ、本人・介護者ともに半額（身体障害者第2種、知的障害者第2種、精神障害者2級・3級は対象外）
