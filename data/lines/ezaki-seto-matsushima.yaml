fare:
  - 旅客運賃（片道・税込）大人 280円、小人（6〜12歳）140円
  - 障害者割引適用時 大人 140円（手帳または「ミライロID」の提示）
  - 車両運賃（長さ別・片道・税込）3m未満 1,320円 / 4m未満 1,590円 / 5m未満 2,090円 / 6m未満 3,340円 / 7m未満 5,460円 / 8m未満 7,530円 / 9m未満 8,910円 / 10m未満 11,620円 / 11m未満 13,460円 / 12m未満 19,550円 / 1m増すごとに 3,000円加算
  - 5m未満ダンプ・キャブ・バケット 3,290円 / 6m未満ダンプ・バケット 4,540円 / 2㎥生コン 4,540円 / 5㎥生コン 10,230円 / 10tダンプ 10,230円
  - 自転車 580円 / バイク50cc 700円 / バイク750cc未満 1,050円 / バイク750cc以上 1,230円
  - 車両運賃には運転手1名分の旅客運賃を含む。同乗者は別途旅客運賃が必要
  - 運賃改定日：令和7年5月1日
notes:
  - 令和8年2月1日よりダイヤ改正
  - 令和8年9月1日〜11日はドック期間のため終日運休（9月12日より運航再開予定）
  - 所要時間：約17分
  - 車両積載可（乗用車19台・トラック6台）、定員122名
  - 5m以上のトラック・危険物積載車は要予約（電話のみ）
  - 地上高3.8m以上の車両は事前連絡必要
  - 出航時間20分前より受付開始
  - 支払いは各種カード・PayPay利用可
  - 乗船場所に駐車場なし（市営駐車場利用）
  - TEL 0959-22-0099 / FAX 0959-22-2941（株式会社江崎海陸運送）
