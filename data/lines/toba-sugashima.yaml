fare:
  - 大人 510円 / 小人 260円（佐田浜〜菅島・普通乗船券）
  - 大人 280円 / 小人 140円（坂手〜菅島・普通乗船券）
  - 回数券（大人 5,100円 / 小人 2,600円、佐田浜〜菅島・有効期限6ヶ月）
  - 1日フリー乗船券（大人 1,480円 / 小人 740円、全航路乗船可）
  - 一般団体（15名以上）は普通運賃の1割引、学生団体は大人3割引・小人1割引
notes:
  - 問い合わせ：鳥羽市定期船課 管理係 0599-25-4776
  - 令和8年4月1日より船員不足に伴い5隻から4隻に減船し、全航路のダイヤを改正
  - 荒天及び船舶検査等により運航船舶やダイヤを変更する場合あり
  - 予備船運航期間や小型チャーター船運航便以外はバリアフリー対応
  - 各港の時刻は出港時間（最終到達港のみ到着時間）
  - 時刻表記載以外にも臨時便（増便）を運航する場合あり
  - 各経由地の寄港地出港時間は遅れることがあり、各到着時間は前後する場合あり
  - 欠航・運航再開情報は「とばメール」登録で受信可能
