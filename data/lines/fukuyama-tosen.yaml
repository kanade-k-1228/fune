name: 福山市営渡船「平成いろは丸」
route: 鞆の浦〜仙酔島
color: "#6fd926"
source:
  - https://www.city.fukuyama.hiroshima.jp/soshiki/kanko/91534.html
  - https://www.city.fukuyama.hiroshima.jp/uploaded/life/409157_2531243_misc.pdf
fare:
  - 大人 240円、こども 120円（片道）
  - 1歳未満は無料
  - 1歳以上6歳未満は大人1人につき1人無料（2人目以降はこども料金）
  - 6歳以上12歳未満はこども料金、12歳以上は大人料金
  - 団体割引（15人以上）一般 1割引、中学生以上の学生 3割引、小学生以下の学生 1割引
notes:
  - 渡船管理事務所 TEL 084-982-2115
  - 観光戦略課 TEL 084-928-1042
  - 所要時間は約5分
  - 団体（15人以上）は事前連絡が必要
  - 2027年春就航予定の新造船（旅客船1隻）を建造中（2026年7月に名称募集）
  - 身体障害者手帳・療育手帳・精神障害者保健福祉手帳所持者とその介護者、および福山市内在住の65歳以上の方は運賃減免（無料、乗船時に書類提示）
  - 2023年4月1日改正ダイヤ
