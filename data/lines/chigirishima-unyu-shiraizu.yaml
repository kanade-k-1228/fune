  - 障害者割引：身体・知的・精神障害者および介護者は5割引（手帳またはミライロIDで確認）
notes:
  - 契島港〜白水港（大崎上島）の特定旅客定期航路（客船）。所要時間約30分（5km）
  - 平日・休日とも同じ時刻に運航
  - 公式時刻表で※印の付いた便は町営フェリー「さざなみ」（白水〜生野島〜契島）であり、本航路ではない（osakikamijima-town-ferry を参照）
  - 契島は東邦亜鉛の私有地のため、関係者以外の上陸はできません
  - 到着時刻は公式に非公表
  - 連絡先：契島運輸 竹原営業所 TEL 0846-22-2628
