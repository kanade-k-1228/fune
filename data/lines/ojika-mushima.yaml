fare:
  - 大人 片道 440円・往復（島発のみ）840円
  - 子供 片道 220円・往復（島発のみ）420円
  - 国境離島島民割引 大人200円・子供100円
  - 定期（大人）15,840円
notes:
  - 通常1日2便（笛吹発7:25・14:30、六島着7:45・14:50）が六島に寄港
  - 11:10発の増便（4便）は六島には寄港せず、野崎島直行便
  - 4月〜5月・7月〜10月は日曜・祝日により運航ダイヤが変動（増便運航日／日曜特別ダイヤ日／運休日）。特別ダイヤ日は六島に寄港する便がなくなるため、事前に町公式サイトの運航カレンダーで要確認
  - 海況により六島港に寄らないことあり
  - 運休日：基本的に毎月第1・3日曜（時期により変動）。詳細は町公式サイトの運航カレンダーで要確認
  - 連絡先：はまゆう 090-4984-8025 / 小値賀町役場 未来創造課 0959-56-3111
