  - フェリー2等 焼尻〜天売：大人790円・小人400円（7月〜8月）
  - 高速船 羽幌〜焼尻：大人2,830円・小人1,420円（4月〜6月）
  - 高速船 羽幌〜天売：大人4,170円・小人2,090円（4月〜6月）
  - 高速船 焼尻〜天売：大人1,340円・小人680円（4月〜6月）
