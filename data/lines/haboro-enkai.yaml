notes:
  - "季節ダイヤ: Ａ期間(10/1〜4/7,4/27・28)1往復(フェリー)／Ｂ期間(4/8〜4/26)1往復(高速船)／Ｃ期間(5/7〜5/31,9/1〜9/30)2往復(フェリー)／Ｄ期間(GW,6月,7〜8月の平日等)4往復／Ｅ期間(7/1〜8/12の土日祝)5往復／Ｆ期間(8/13〜8/15)6往復"
  - フェリー（おろろん2）と高速船（さんらいなぁ2）を併用
  - 所要時間：フェリー 羽幌〜焼尻 約60分／羽幌〜天売 約90分
  - 所要時間：高速船 羽幌〜焼尻 約35分／羽幌〜天売 約60分
  - Ａ期間（1便のみ）は早出し運航となる場合あり（島での滞在時間が短くなるため要確認）
  - 支払いは現金のみ（クレジットカード・電子マネー不可）
  - TEL 0164-62-1774 / FAX 0164-62-5231
  - 北海道苫前郡羽幌町港町1丁目51番地
fare:
  - フェリー2等 羽幌〜焼尻：大人1,600円・小人800円（9月〜6月）
  - フェリー2等 羽幌〜天売：大人2,330円・小人1,170円（9月〜6月）
  - フェリー2等 焼尻〜天売：大人730円・小人370円（9月〜6月）
