  - 高速船 羽幌〜天売：大人4,360円・小人2,180円（7月〜8月）
  - 高速船 焼尻〜天売：大人1,400円・小人710円（7月〜8月）
  - 自転車870円／原付（〜125cc）1,720円／二輪（〜750cc）2,680円／二輪（750cc〜）3,530円
  - 自動車航送運賃（3m未満・ドライバー1名分込）：羽幌〜焼尻5,980円／羽幌〜天売8,760円／焼尻〜天売2,780円（車長により加算、要予約）
  - 学生割引：フェリー2等・高速船運賃を2割引（学生証等提示）
  - 夏休み親子割引（7月第3土曜〜8月31日）：親子とも運賃3割引（小学生〜高校生対象）
  - 障がい者割引：本人と介護者1名の運賃5割引（第1種）／本人のみ運賃5割引（第2種）（各種手帳提示）
  - 宿泊研修団体割引（学生15名以上）：運賃5割引（学校長等の証明書提示）
  - レンタカーセット割引（5/1〜9/30、ワールドネットレンタカー利用者対象）：運賃2割引
