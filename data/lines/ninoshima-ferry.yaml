name: 似島汽船
route: 宇品〜似島
color: "#26bdd9"
source:
  - https://ninoshimakisen.jp/time_price
fare:
  - "旅客運賃（片道）: 大人450円・小人220円"
  - "回数券: 11枚綴り（大人のみ）4,500円"
  - "自転車持込: 160円"
  - "原付自転車（125cc以下）: 310円"
  - "二輪自動車（750cc未満）: 460円"
notes:
  - "電話: 082-251-6516"
  - "所在地: 広島市南区宇品海岸1-13-26"
  - 片道約20分
  - 乗船券は宇品港旅客ターミナル内の券売機で購入可。似島港には券売機なし（できるだけ往復券を購入推奨）
  - "9:30発便（4便南行）は学園前経由:
    広島発9:30→学園着9:47→学園発9:50→似島港着10:07。学園前でお車の方は9:10までに券売機でチケット購入のこと"
  - "13:00発便（7便北行）・14:30発便（8便北行）は学園前経由: 似島港で一旦下船後、学園前に寄港して広島港着"
  - 広島発12:30便・14:00便（6・7便南行）乗車の車は似島港でいったん全車下船（折り返し北行便のため入れ替え不可）
  - 元旦ダイヤ・1月2日〜3日ダイヤあり（年始は運航便数減少）
