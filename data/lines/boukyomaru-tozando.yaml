fare:
  - 大人 1,000円（中学生以上）
  - こども 500円（5歳以上小学生まで）
  - 5歳未満無料（保護者同伴）
  - ペット無料
  - 障害者割引5割（手帳提示）
notes:
  - 運航事業者：一般財団法人旧大杉村再生協議会
  - 予約・問い合わせ：0598-31-3661（10:00〜17:00）
  - 運航期間：4月中旬〜11月中旬
  - 水曜運休、年末年始（12/30〜1/3）運休、県道通行止め時運休
  - 平日は原則4名以上・3日前までに要予約。土日祝は予約優先で空席あれば当日乗船可
  - 現在臨時休業中（2021年8月〜、公式サイトに掲載）
  - 大杉乗船場発は全便第3乗船場を経由し宮川ダム湖遊覧船として運航（所要約65分）
  - 登山道連絡船（大杉乗船場〜第3乗船場）所要約20分
  - 乗船チケットはやまよし食堂（登山センター横）で販売
