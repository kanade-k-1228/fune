fare:
  - 大人：片道 280円
  - 小児（小学生以下）：片道 140円
  - 大人 1人につき 1名の未就学児及び 1歳未満児は無料
  - 回数券：大人 11枚綴り 2,800円／小児 11枚綴り 1,400円
  - 通学定期（児童・園児）：1箇月 3,360円／3箇月 9,580円
  - 通学定期（中学生・高校生等）：1箇月 6,720円／3箇月 19,160円
  - 通勤定期：1箇月 10,080円／3箇月 28,730円
  - 自転車・荷車等：1台 190円／原動機付自転車：1台 370円／2輪（0.75L 未満）：1台 550円
  - 受託手荷物：1個 130円
  - 小荷物：10kg以下 100円／10kgを超え20kg以下 190円／20kgを超え30kg以下 280円
  - 貨物：40kg以下 320円／40kgを超え50kg以下 470円／50kgをこえるもの 670円
  - 貸切運賃（臨時運航）：1航海（片道）8,400円
  - 障害者等の割引運賃あり（令和元年10月1日改定）
notes:
  - 問い合わせ：周防大島町地域交通課 地域交通班 TEL 0820-79-1015 / FAX 0820-79-1020
  - 定期に運航する便の他、必要に応じて1便増便をすることがあります。
  - 必要に応じて臨時便を運航することがあります。臨時便は貸切運航することがあります。
