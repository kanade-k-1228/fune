fare:
  - 運賃：大人240円、こども120円
  - 1歳未満無料。1歳以上6歳未満は大人1人につき1人無料（2人目以降こども料金）。6歳以上12歳未満はこども料金。12歳以上は大人料金。
  - 団体割引（15人以上）：一般1割引、学生（中学生以上）3割引、学生（小学生以下）1割引
notes:
  - 身体障害者手帳・療育手帳・精神障害者保健福祉手帳の交付を受けた方および介護者、市内在住の65歳以上の方は無料
  - 航行所要時間：約5分
