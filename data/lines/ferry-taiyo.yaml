  - 二等小人 宮之浦〜島間 730円 / 宮之浦〜口永良部 1,070円 / 口永良部〜島間 1,790円
  - 有人国境離島法に基づく町民割引 宮之浦〜口永良部 大人950円・小人480円
  - 有人国境離島法に基づく障がい者等割引（離島航空割引カード提示） 宮之浦〜口永良部 片道480円・往復960円（手帳等提示のみの場合は片道1,070円・往復2,140円）
  - 自動車航送運賃（運転者1名分の二等運賃を含む） 3m未満5,330円 / 3m以上4m未満6,660円 / 4m以上5m未満7,980円 / 5m以上6m未満10,660円 / 6m以上7m未満13,310円 / 7m以上8m未満15,990円 / 8m以上9m未満18,660円 / 9m以上10m未満21,320円 / 10m以上11m未満23,940円 / 11m以上12m未満26,560円
  - 受託手荷物 270円 / 自転車・軽車両 340円 / 原動機付自転車 670円 / 自動二輪750cc未満 1,000円 / 自動二輪750cc以上 1,330円
notes:
  - 偶数日・奇数日でダイヤが異なる
  - 年に数回、ドック入り（定期検査）のため数日間運休することがある（実施時期は年により変動。詳細は公式サイトで要確認）
  - 旅客の予約は不可。15名以上の団体予約は屋久島町役場政策推進課（平日8:30〜17:15）で受付
  - 屋久島町役場政策推進課 TEL 0997-43-5900 / FAX 0997-43-5905
  - 車両予約問い合わせ 宮之浦港 屋久島海陸運輸 TEL 0997-42-0140 / 口永良部島港 久木山運送 TEL 0997-49-2570 / 島間港 船川運送 TEL 090-4771-3417
  - 船内に Wi-Fi、エレベーター、バリアフリー室、キッズスペース、多目的室あり
