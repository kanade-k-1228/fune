fare:
  - 大人 740円 / 小人 370円（鳥羽〜神島・片道）
  - 大人 510円 / 小人 260円（答志(和具)〜神島・片道）
  - 大人 510円 / 小人 260円（菅島〜神島・片道）
  - 回数券 大人 7,400円 / 小人 3,700円
  - 1日フリー乗船券 大人 1,480円 / 子ども 740円（全航路有効・佐田浜窓口で販売）
  - 1歳未満無料、1歳以上は大人1名につき幼児1名無料、小学生は小人運賃
  - 団体割引（15人以上） 一般団体は普通運賃の1割引、学生団体は小人運賃の1割引・大人運賃の3割引（学校行事に限る）
notes:
  - 鳥羽市定期船課 電話 0599-25-4776
  - 令和8年4月1日より深刻な船員不足に伴い5隻から4隻に減船し全航路のダイヤを改正
  - 冬期ダイヤ 10月16日〜2月末日、夏期ダイヤ 3月1日〜10月15日
  - 各港の時刻は出港時間。各港行きの最終到達港については到着時間
  - 荒天および船舶検査等により運航船舶やダイヤを変更する場合あり
  - 時刻表記載の時間以外にも臨時便（または増便）を運航することがある
  - 各経由地の寄港地出港時間は遅れることがあり、各到着時間は前後する場合あり
  - 予備船運航期間や小型チャーター船運航便以外はバリアフリーに対応
  - かもめバスへの乗継割引あり（乗船券・回数券で往復各100円引き、定期券で200円引き）
