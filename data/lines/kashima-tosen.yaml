name: 松山市営
route: 鹿島公園渡船
color: "#b0d926"
source:
  - https://www.city.matsuyama.ehime.jp/kanko/kankoguide/shitestukoen/kashima/tosen.html
  - https://www.city.matsuyama.ehime.jp/kanko/kankoguide/shitestukoen/kashima/kashima.html
fare:
  - adult::round::230円
  - child::round::120円
  - disabled::round::120円（大人）
  - disabled::round::60円（小児）
  - group::round::160円（大人、15人以上）
  - group::round::80円（小児、15人以上）
  - 高齢者（65歳以上）往復120円
  - 荷物 1個10kgごと 20円
  - 自転車持込不可（輪行袋は可）
  - キャッシュレス決済対応
notes:
  - 毎日運航
  - 約20分間隔・所要約3分
  - 夏期ダイヤ（4〜11月）は14:15鹿島発の周遊航路「愛の航路」あり（鹿島発着・所要約30分・予約不要・2名から運航）。12〜3月は運休
  - 島内店舗利用客には最終便以降の臨時運航あり（要事前申込）
  - 強風・高波により臨時運休の場合あり
  - 鹿島公園渡船待合所 TEL 089-992-1375（7:00〜21:00）
  - 運賃は令和7年4月1日改定
ships:
  - かしま
