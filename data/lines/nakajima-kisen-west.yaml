notes:
  - 西線フェリー（三津浜〜釣島〜神浦〜二神〜津和地〜元怒和〜上怒和〜西中）
  - 一部便は高浜港を経由しない
  - 松山での車両・自動二輪車・原付・自転車の乗降は三津浜港のみ可能（車両が満車の場合は、神和方面行きを優先して乗船）
  - 潮位により車両の乗降不可の港あり（要事前確認）
  - 「三津浜港」「神浦港」は予約不可。その他の港は車両のみ予約可（出航30分前まで）
  - お問合せ TEL 089-997-1221（営業時間 8:00〜18:30）
fare:
  - 大人 三津浜〜釣島 520円（小児260円）
  - 大人 三津浜〜神浦 910円（小児460円）
  - 大人 三津浜〜二神／津和地／元怒和／上怒和／西中 1,240円（小児620円）
  - 大人 釣島〜神浦 440円（小児220円）
  - 大人 釣島〜二神／津和地／元怒和／上怒和 1,020円（小児510円）
  - 大人 神浦〜二神／津和地／元怒和／上怒和 650円（小児330円）
  - 大人 上怒和〜西中 610円（小児310円）
  - 車両 3m未満 三津浜〜釣島 2,160円／三津浜〜神浦 3,310円／三津浜〜上怒和 4,570円
  - 自転車 三津浜〜釣島 170円／三津浜〜神浦・西中まで 260円
  - 障がい者割引・団体割引あり
