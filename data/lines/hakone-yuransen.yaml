name: 箱根遊船
route: 箱根町〜元箱根〜箱根園〜桃源台
color: "#2926d9"
source:
  - https://www.hakone-yuransen.jp/timetable/
  - https://www.hakone-yuransen.jp/route/
  - https://www.hakone-yuransen.jp/
fare:
  - "1日フリー乗船券: 大人 2,900円 / 小人 1,450円"
  - "周遊40分コース（関所跡・元箱根・箱根園）: 大人 2,400円 / 小人 1,200円"
  - "周遊70分コース（全4港）: 大人 2,900円 / 小人 1,450円"
  - "関所跡〜元箱根: 大人 600円 / 小人 300円"
  - "関所跡〜箱根園: 大人 1,200円 / 小人 600円"
  - "関所跡〜湖尻: 大人 1,450円 / 小人 730円"
  - "元箱根〜箱根園: 大人 1,200円 / 小人 600円"
  - "元箱根〜湖尻: 大人 1,450円 / 小人 730円"
  - "箱根園〜湖尻: 大人 1,200円 / 小人 600円"
  - "ワンちゃん運賃（中・小型犬30kg未満、飼い主と同一区間）: 300円"
  - 一般団体（15名以上）は各区間割引運賃あり
  - 学生団体（15名以上）は各区間割引運賃あり（添乗員1名・エスコート1名無賃）
  - 身体障害者手帳提示で5割引
  - 2026年4月1日運賃改定（本データは改定後の運賃）
notes:
  - 箱根関所跡港 TEL 0460-83-6015
  - 元箱根港 TEL 0460-83-6351
  - 箱根園港 TEL 0460-83-6265
  - 湖尻港 TEL 0460-84-8883
  - 運航会社所在地 神奈川県足柄下郡箱根町元箱根45-3
  - 半周40分コース・1周70分コースの周遊あり（途中港乗降不可、定期航路の便を利用）
  - 全席自由席
  - 自転車持込可（運賃必要）
  - 前売券は乗船前日まで購入可
  - "「SORAKAZE」「大茶会」の2隻を運航（日により就航船が変わる）"
  - "毎月13日は一部便が運休（例: 12/13は9便が神山桟橋行の参拝船に振替、詳細は公式サイト参照）"
  - 2026年12月30日以降のダイヤは公式サイト（時刻表ページ）を要確認（本データは2026年12月29日まで反映）
  - 天候・メンテナンス等により予告なくダイヤが変更される場合あり
ships:
  - SORAKAZE
  - 大茶会
