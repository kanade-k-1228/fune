notes:
  - 伊保田港寄港便は周防大島松山フェリー株式会社の運航となります。
  - 伊保田港発着便の車両でのご乗船は完全予約制となります。
  - 伊保田港発三津浜港行・三津浜港発伊保田港行のお車の乗船はバックでの積み込みとなります。
  - 祝日につきましては、曜日どおりの運航ダイヤとなります。
  - 2025年3月1日ダイヤ改正。
  - 2026年8月1日運賃改定。
  - オレンジライン乗船予約センター(柳井) 0820-22-3311 / (松山) 089-951-3509 / (伊保田) 0820-75-1575。
  - 所要時間は柳井〜三津浜で約2時間30分。
fare:
  - 旅客運賃 (柳井〜伊保田) おとな 片道 1,640円 / 往復 3,120円。
  - 旅客運賃 (柳井〜伊保田) こども 片道 820円 / 往復 1,560円。
  - 旅客運賃 (伊保田〜三津浜) おとな 片道 2,570円 / 往復 4,890円。
  - 旅客運賃 (伊保田〜三津浜) こども 片道 1,290円 / 往復 2,460円。
  - 乳幼児 (1才〜6才未満) は無賃 (おとな1名につき1名まで)。
  - 車両運賃 (柳井〜伊保田) 3m未満 3,300円 / 4m未満 4,300円 / 5m未満 5,000円 / 6m未満 5,600円 (運転手1名の旅客運賃含む)。
  - 車両運賃 (伊保田〜三津浜) 3m未満 6,500円 / 4m未満 8,000円 / 5m未満 9,400円 / 6m未満 10,300円 (運転手1名の旅客運賃含む)。
  - 車両同乗者運賃 (伊保田〜三津浜) おとな 片道 2,200円 / こども 片道 1,100円。
