  - 名護〜本部：片道 500円
notes:
  - 高速船「ジンベエ・マリン（タクマ3）」は令和8年2月16日（2026-02-16）より運休、その後無期限休止。
  - 令和8年3月17日付のお知らせで、3月31日をもって定期高速船「タクマ3」航路を無期限休止する旨および今後の事業体制を公式に告知（出典 daiichi-marine.com/pdf/20260317.pdf）。
  - 船体の老朽化・部品調達困難・代船確保不調により運航継続を断念。
  - 2026年8月時点で再開・代船導入の発表は確認できない（無期限休止のため、航路廃止届は未確認）。
  - 船体諸元：全長30.7m / 全幅7.8m / 乗客定員180名 / 巡航速度30ノット（時速約56km）、サイクルスタンド9台。
  - チケット販売所：那覇（沖縄県那覇市泊3丁目1-8）／名護（名護市城3丁目6537-1番地・名護港待合所）／本部（国頭郡本部町谷茶29・渡久地港旅客待合所）。
  - 問い合わせ先：第一マリンサービス株式会社（那覇市旭町116-37 カフーナ旭橋オフィスコート2F）TEL 098-860-0152（平日9:00〜17:00）。
