ships:
  - ひめしま
fare:
  - 大人 片道 470円 / 往復 940円
  - 小人 片道 240円
  - 姫島在住者往復割引 大人 860円 / 小人 440円
  - 姫島在住65歳以上 片道 240円 / 往復 440円
  - 通勤定期 1ヶ月 16,920円 / 3ヶ月 48,230円
  - 通学定期 1ヶ月 11,280円 / 3ヶ月 32,150円
  - 団体割引（15名以上）一般1割引・学生大人3割引（学校長証明要）・学生小人1割引
  - 障がい者割引あり（手帳提示）
notes:
  - 運航会社：糸島市（市営渡船）
  - 問い合わせ：糸島市役所コミュニティ推進課 092-332-2062（代表 092-323-1111）
  - 運航中の船舶連絡先：渡船ひめしま 090-3326-5382
  - 所要時間：約16分／旅客定員：76名
  - 1月1日は第2便（姫島発 9:50／岐志発 11:50）のみ運航（第1・第3・第4便は運休）
  - 1月2日は第1便（姫島発 7:00／岐志発 7:50）が運休
  - 天候等により欠航となる場合あり
