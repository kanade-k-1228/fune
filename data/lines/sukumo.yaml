name: 宿毛市営定期船
route: 宿毛〜沖の島〜鵜来島
color: "#d9263c"
source:
  - https://www.city.sukumo.kochi.jp/docs-05/p0325.html
fare:
  - 片島〜沖の島町各港（母島・弘瀬・鵜来島）：大人 1,350円 / 高校生 1,080円 / 小人・中学生・障害者 680円
  - 母島〜弘瀬：大人 210円 / 高校生 170円 / 小人・中学生・障害者 110円
  - 母島〜鵜来島・弘瀬〜鵜来島：大人 380円 / 高校生 310円 / 小人・中学生・障害者 190円
  - 沖の島町各港発着の往復は2割引（有効期間5日）
notes:
  - 宿毛市営定期船片島扱所 TEL 0880-65-8568（営業時間 6:00〜7:00、9:30〜10:30（平日のみ）、13:00〜14:30）
  - 高校生は学生証、障害者は障害者手帳の提示が必要
  - 1人2つを超える手荷物・貨物は別途貨物料金が必要
  - 天候により運休となる場合あり
  - 第1便は片島〜鵜来島が直航で、復路に弘瀬・母島へ寄港
  - 第2便は鵜来島から片島が直航
