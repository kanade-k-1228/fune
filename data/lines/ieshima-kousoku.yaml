notes:
  - 令和7年2月8日ダイヤ改正
  - 土日祝ダイヤは平日と同時刻
  - 平日：第1・5・6・7便は中型船「家島ライフ」を使用
  - 土日祝：第5・6・7便は中型船「家島ライフ」を使用
  - 姫路営業所 TEL 079-231-0280（〒672-8063 姫路市飾磨区須加294 ポートセンタービル1階）
  - 真浦事務所 TEL 079-325-0280
  - 自転車航送は真浦港のみ取扱い・先着2台まで（300円）
  - ペットはケージ等に入れて乗船可（料金無料）
fare:
  - 大人 姫路〜家島（真浦/宮）片道 1,000円
  - 中学生・高校生・専門学生・大学生 片道 500円
  - 小人（小学生）片道 300円（保護者同伴の場合、大人1人につき2人まで4年生以下は無料、3人目より有料）
  - 大人 回数券（11枚綴り）10,000円
  - 中高生・専門学生・大学生 回数券（11枚綴り）5,000円
  - 大人 1か月定期 32,000円（真浦営業所のみ販売）
  - 中高生 1か月定期 16,000円
  - 専門学生・大学生 1か月定期 20,000円
  - 受託手荷物 300円
  - 自転車 300円（真浦港のみ取扱い）
