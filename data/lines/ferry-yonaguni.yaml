fare:
  - 大人片道3,610円・往復6,860円（発売日から14日間有効、2026年2月時点）
  - 与那国発の往復（島発往復）は6,140円（2026年2月時点）
  - 小人（6〜11歳）片道1,810円、学生割引片道2,890円、身障者片道1,810円
  - 手荷物運賃 自動二輪車(50cc以上)3,630円、原付(50cc未満)1,820円、自転車1,200円
  - 自動車運賃 片道14,300円〜72,600円（車両長3m未満〜12m未満、以降1mごとに6,060円加算）・往復27,170円〜137,940円（購入日から2週間有効、事前予約制）
notes:
  - 台風や荒天で欠航多い
  - 徒歩・原付・バイク・自転車の乗船は予約不要（出航30分前までに手続き）、車両積載は事前予約制
  - 毎年7〜8月頃に約2週間のドック整備による運休あり（運休の約2か月前から案内）
