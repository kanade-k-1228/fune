fare:
  - 旅客料金（片道・税込）：大人6,500円、子供4,000円
  - 燃料サーチャージ（令和8年6月1日より）：旅客 大人・子供 片道500円（税込）
  - 13歳以上は大人料金。6歳未満は大人1名につき子供1名無料（それ以外は子供料金）
  - 車両料金（片道・税込）：4m未満 有人23,000円／無人20,000円、5m未満
    有人27,000円／無人22,000円、6m未満48,000円、7m未満57,000円、8m未満65,000円、9m未満70,000円、10m未満80,000円、11m未満88,000円、12m未満98,000円、以後1m毎9,500円増（6m以上は有人のみ）
  - 燃料サーチャージ（車両・令和8年6月1日より）：4m・5m未満 片道3,000円、6m未満以上 片道4,000円（税込）
  - 燃料サーチャージ（二輪車・令和8年6月1日より）：片道1,000円（税込）
  - 有人車往復利用の場合、復路のみ2割引（適用期限2週間）
  - 二輪車料金（片道・税込）：自転車3,000円、50cc以下（無人）6,000円、50〜125cc以下（無人）8,000円、126cc以上（有人）18,500円
notes:
  - 定期ドックのため2026年8月17日(月)〜8月29日(土)運休（8月16日厳原港出港・8月29日博多港出港は通常運航）。一般貨物はドック期間中も通常通り受付。
  - 1日1往復。博多港 出港23:00頃／入港13:10頃、厳原港 出港09:10頃／入港03:20頃（所要約4時間）
  - 厳原港到着後、午前7時までは船室で休息可能
  - キャタピラ車・車幅2.5m超は25%増
  - 126cc以上の二輪は有人のみ受付。厳原港8時・博多港22時までに来港要
  - 乗客定員12名、積載車両：大型15台（乗用車換算約50台）
  - 主要項目：総トン数1,083トン、全長90m、航海速力17ノット
  - 予約受付時間：午前8時〜午後5時
  - 福岡本社（博多港発着所）：福岡市中央区那の津5丁目6番8号 TEL:092-712-2057／FAX:092-741-1053
  - 対馬支店：長崎県対馬市厳原町久田道1661番地 TEL:0920-52-4014／FAX:0920-52-5903
  - 厳原港フェリー事務所：長崎県対馬市厳原町東里字野良4号岸壁
