  - 定時運航ではなく、運航時間帯内で客がいれば随時出航（オンデマンド運航）
  - 運航時間帯：①6:30〜9:30 ②10:00〜10:30 ③11:00〜11:30 ④13:00〜13:30 ⑤14:00〜14:30 ⑥15:00〜15:30 ⑦16:00〜16:30 ⑧17:00〜18:30
