  - 年中無休（気象条件で欠航あり。増水・強風時は松茂側の黄色いパトライトが点灯）
  - 定員18名（運航員2名含む）。自転車も乗船可、救命胴衣不要
  - 電話 088-699-6884（渡船場）／ 088-699-8718（松茂町建設課）
