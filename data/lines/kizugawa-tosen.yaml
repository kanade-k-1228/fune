fare:
  - 無料（人と自転車のみ・原付/バイク不可）
notes:
  - 大阪港湾局管理（市営渡船 8 航路で唯一）
  - 対岸まで約1〜5分・乗船次第出航
  - 1月1日〜1月3日は終日休航
  - 火曜日 9:45 船町側発（往復便）は給油のため運休（2024年3月19日改正。予備船「第二松丸」の2024年3月末廃船に伴う）
  - 連絡先：木津川渡船事務所 06-6551-3143
  - 管理：大阪市建設局西部方面管理事務所 河川・渡船管理事務所 06-6536-5295
