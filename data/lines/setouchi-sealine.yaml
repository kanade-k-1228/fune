fare:
  - 広島港－小用港 旅客通常運賃（片道・税込）：大人1,080円、小人540円。
  - 広島港－切串港 旅客通常運賃（片道・税込）：大人950円、小人480円。
notes:
  - 旅客船のみの運航。車両は乗船不可。
  - ◎印の便は土日祝日運休。
  - △印の便（19便・切串経由）は日・祝日のみ切串港に寄港。
  - 広島港⇔プリンスホテル前の区間のみの乗船不可。
  - ご予約は15名様以上の団体旅客のみ可能。
  - 2026年9月1日より運賃改定予定：広島港－小用港 大人1,130円・小人570円、広島港－切串港 大人1,000円・小人500円。
