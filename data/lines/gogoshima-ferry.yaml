fare:
  - 旅客（片道）：大人300円、小人150円
  - 自転車：160円、単車（125cc以下）：310円、自動車二輪車：460円
  - 車両（片道・運転者1名込）：3m未満1,280円／3〜4m1,580円／4〜5m1,890円／5〜6m2,460円／6〜7m2,980円／7〜8m3,500円／8〜9m4,030円／9〜10m4,550円／10〜11m5,080円／11〜12m5,600円
notes:
  - 株式会社ごごしま運航
  - TEL：089-961-2034 / FAX：089-961-2088
  - 泊航路：フェリーしとらす・所要約10分・1日14便
  - 由良航路：フェリーミソラ・所要約13分・1日14便
  - 12月31日〜1月3日は運休
  - 2026年7月19日〜8月16日は「高浜発由良行9:55」「高浜発泊行15:25」の2便が船越港に寄港（乗下船希望者は船員へ要申出）
  - 2026年8月13日〜16日はお盆期間臨時ダイヤで運航（増便）
