notes:
  - "東海汽船 カスタマーセンター: 03-5472-9999 (毎日9:30〜18:00)"
  - "所要時間 (竹芝発・最短、夏季ダイヤ基準): 大島 大型客船7時間/ジェット船1時間45分、利島 大型客船8時間40分/ジェット船2時間24分、新島 大型客船9時間35分/ジェット船2時間20分、式根島 大型客船10時間5分/ジェット船2時間40分、神津島 大型客船11時間/ジェット船3時間10分"
  - "運航は海上・気象状況により欠航または寄港地変更となる場合あり"
  - "運賃は片道大人料金 (2026年8月時点・公式運賃表、燃料油価格変動調整金を含み毎月変動あり)"
  - "通常期（夏季・年末年始を除く期間）は大型客船夜行便が特定日運休、ジェット船は土休日等に限定運航する便（利島・新島・式根島・神津島まで運航する便を含む）があり、詳細日程は公式サイト時刻表ページの運航日カレンダーを要確認"
  - "夏季ジェット船1420便は新島までの直行便で、新島から東京へ戻る帰路便を兼ねる場合がある（運航順の詳細は公式サイト参照）"
  - "通常期の大型客船帰路便は土休日に横浜（大さん橋）を経由するため東京着が遅くなる"
