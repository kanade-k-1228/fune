fare:
  - adult::oneway::2,500円
  - adult::round::4,880円
  - child::oneway::1,250円
  - child::round::2,440円
  - car::11,400円（軽自動車・運転者1名分含む）
  - car::13,400円（普通車・運転者1名分含む）
  - car::15,200円（普通貨物車等 〜6m未満）
  - car::17,900円（〜7m未満）
  - car::19,800円（〜8m未満）
  - car::21,900円（〜9m未満）
  - car::24,600円（〜10m未満）
  - car::26,700円（〜11m未満）
  - car::28,500円（〜12m未満）
  - car::33,000円（〜13m未満）
  - car::13m以上は1mごとに1,900円加算
  - bicycle::2,600円（輪行袋に収納すれば無料で持込可）
  - moto::3,200円（125cc以下）
  - moto::4,400円（125cc超）
  - グリーン席追加 WEB予約500円 / 船内購入1,000円
  - 上記は通常期（2025年10月1日〜2026年12月31日、繁忙期を除く）運賃
  - 繁忙期（2026年8月10日〜8月17日）は乗用車（軽自動車・普通車）が1,000円増、二輪車/自転車が500円増、グリーン席WEB予約が1,000円（その他区分の車両運賃は同額）
notes:
  - 第1便は通年休航（季節等によって運航する場合あり）
  - 土休日ダイヤは北行7便・8便の和歌山港着時刻が異なる（2019年4月6日変更）
  - 乗組員の要員不足により2026年8月1日〜当面の間、フェリーかつらぎの一部便（南行2便・8便、北行3便・9便）を運休し8往復から6往復体制で運航中（復帰時期未定）
  - 2028年3月末を目途に航路撤退予定（船舶老朽化・要員確保の状況次第で前倒しの可能性あり）
  - 予約・問い合わせ 和歌山営業所 073-422-2156 / 徳島営業所 088-636-0750
