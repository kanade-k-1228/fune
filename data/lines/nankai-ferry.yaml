fare:
  - 旅客 大人 片道 2,500円 / 往復 4,880円
  - 旅客 小児 片道 1,250円 / 往復 2,440円
  - 自動車航送（運転者1名含む）軽自動車 11,400円
  - 自動車航送（運転者1名含む）普通車（5m未満）13,400円
  - 自動車航送 5〜6m未満 15,200円 / 6〜7m未満 17,900円 / 7〜8m未満 19,800円
  - 自転車 2,600円 / 125cc以下 3,200円 / 125cc超 4,400円
  - グリーン席追加 WEB予約 500円 / 船内購入 1,000円
  - 繁忙期（8月10〜17日）は自動車・バイク料金が100〜500円増
notes:
  - 第1便は通年休航（季節等によって運航する場合あり）
  - 土休日ダイヤは北行7便・8便の和歌山港着時刻が異なる（2019年4月6日変更）
  - 運賃は2025年10月1日〜2026年9月30日適用
  - 予約・問い合わせ 和歌山営業所 073-422-2156 / 徳島営業所 088-636-0750
