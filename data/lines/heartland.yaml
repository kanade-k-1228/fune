  - 稚内～礼文（香深）：2等 大人 3,950円 / 2等指定席 4,610円 / 1等ラウンジ・1等和室 7,270円
  - 利尻～礼文：2等 大人 1,800円 / 2等指定席 2,110円 / 1等ラウンジ・1等和室 3,290円
  - 小児は半額（10円未満の端数は5円以上切上げ、5円未満切捨て）
  - 自動車航送（運転者1名の2等運賃含む・片道）：3m未満 16,540〜18,610円、12m未満 72,860〜81,620円、12m以上は1mごとに6,510〜7,300円加算
  - 自転車：1,650〜3,300円 / 自動二輪：3,500〜12,000円（排気量による）
notes:
  - 電話 0162-23-3780（予約・お問い合わせ 9:00〜17:00、運航状況確認 通年 05:30〜）
  - 所要時間：稚内〜鴛泊・香深ともに約1時間40分
  - 台風や低気圧等の悪天候により欠航となる場合あり、運航状況は公式サイトまたはLINE公式アカウントで配信
  - 夏期（6/1〜9/30）は利尻島 沓形〜礼文島 香深間にも便あり（沓形発14:25〜香深着15:05、香深発12:50〜沓形着13:30）
