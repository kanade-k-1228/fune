name: 日豊汽船
route: 浦城〜島浦島
color: "#d96026"
source:
  - https://www.city.nobeoka.miyazaki.jp/soshiki/4/2870.html
  - https://www.city.nobeoka.miyazaki.jp/uploaded/attachment/24549.pdf
fare:
  - 旅客運賃（消費税含む）：高速艇 大人470円・小人240円、フェリー 大人420円・小人210円。回数券11枚は高速艇4,700円・フェリー4,200円。定期券（1ヶ月）通学は高速艇11,280円・フェリー10,080円、通勤は高速艇16,920円・フェリー15,120円。
  - 自動車航送運賃（消費税含む、運転者1名分の運賃を含む）：3m未満2,000円、3〜4m未満2,500円、4〜5m未満3,280円、5〜6m未満4,370円、6〜7m未満5,630円、7〜8m未満6,680円、8〜9m未満7,540円、9〜10m未満8,460円、10〜11m未満9,100円、11〜12m未満9,930円（12m以上は1mごとに1,150円加算）。
  - 特殊手荷物運賃（消費税含む）：自転車370円、原動機付自転車730円、二輪自動車750cc以下1,100円、750cc超1,460円。
  - 団体（要予約）：一般15名以上1割引、学生団体は大人3割引（中学生以上）・小人1割引（つきそいの大人3割引）。
  - 障害者割引：第1種（身体・知的）または精神1級は本人と介護者1名が5割引、第2種（身体・知的）および精神2〜3級は本人のみで片道101km以上の旅行に限り5割引。
notes:
  - 日豊汽船株式会社が運航（令和7年10月1日改正ダイヤ）
  - 浦城本社（延岡市浦城町5番地）電話 0982-43-0102、FAX 0982-43-0103
  - 島浦営業所 電話 0982-43-1118
  - 高速艇は所要約10分、島浦側は「中央」発着
  - フェリーは所要約20分、島浦側は「宇治」発着
  - 高速艇の島浦発14:35便、浦城発14:55便は減便されています
  - "*印は日曜・祭日運航休止"
  - ▲印は土曜・日曜・祭日運航休止
