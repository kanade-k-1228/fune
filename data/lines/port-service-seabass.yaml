name: 横浜シーバス
color: "#d9265b"
route: 横浜駅東口〜ハンマーヘッド〜ピア赤レンガ〜山下公園
source:
  - https://www.yokohama-cruising.jp/contents/seabass.html
  - https://yokohama-cruising.jp/seabass/
fare:
  - 横浜駅東口⇔ハンマーヘッド 大人 1,300円 / 小児 650円
  - 横浜駅東口⇔ピア赤レンガ 大人 1,300円 / 小児 650円
  - 横浜駅東口⇔山下公園 大人 1,500円 / 小児 750円
  - ハンマーヘッド⇔ピア赤レンガ 大人 1,000円 / 小児 500円
  - ハンマーヘッド⇔山下公園 大人 1,300円 / 小児 650円
  - ピア赤レンガ⇔山下公園 大人 1,300円 / 小児 650円
  - 小児は3歳〜小学生。2歳以下は大人1名につき1名まで無料
notes:
  - 横浜港の水上バス（横浜駅東口は横浜ベイクォーター発着）
  - 便によりハンマーヘッド寄港なし（HH無）またはピア赤レンガ寄港なし（赤無）あり
  - 一部便は直行（横浜駅東口〜山下公園）
  - 所要時間 横浜駅東口〜ハンマーヘッド 約10分、〜ピア赤レンガ 約15分、〜山下公園 約25分
  - 運航 Y Cruise 株式会社 代表 TEL 045-662-6125
  - 横浜駅東口乗り場 TEL 045-453-7047
  - ハンマーヘッド乗り場 TEL 045-307-4815
  - 赤レンガ倉庫乗り場 TEL 090-4911-6151
  - 山下公園乗り場 TEL 045-264-6855
  - 荒天・視界不良・潮位・メンテナンス等で欠航・運休となる場合あり
