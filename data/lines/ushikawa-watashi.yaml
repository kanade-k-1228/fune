notes:
  - 航路延長約70m
  - 手漕ぎ（竹竿操船）の渡し船。自転車乗船可
  - 舟呼び板を叩いて船頭を呼ぶ方式（予約不可）
  - 大雨・洪水・大雪・暴風・暴風雪警報発表時は運休
  - 運航終了時刻の10分前までに乗船の申し出が必要
  - 豊川石田水位観測所の水位が1.0mを超える場合は運休
  - 日没後は運航なし
  - 豊橋市建設部土木管理課 0532-51-2506
