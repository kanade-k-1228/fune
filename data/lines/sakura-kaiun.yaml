fare:
  - 旅客運賃：大人430円、小人210円（大人往復割引810円）
  - 車両運賃：軽自動車等（〜4m未満）1,270円（往復2,410円）、普通自動車（4〜6m未満）2,000円（往復3,800円）、中型車（6〜10m未満）3,320円、大型車（10〜12m未満）4,680円、12mを超える場合は1m増ごとに＋400円
  - 特殊手荷物：自転車220円、原付（125cc未満）320円、自動二輪（125cc以上）420円
  - 運賃は令和8年7月1日改定
notes:
  - 所要時間：約12分
  - 月曜日〜金曜日は1日18航海の年間運行
  - 東行1便（天応5:45発）・西行1便（切串6:02発）は土・日・祝祭日は運休
  - 必要に応じて臨時便を運航することがあります
  - 臨時便は貸切運行することがあります
