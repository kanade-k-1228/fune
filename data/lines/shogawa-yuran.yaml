notes:
  - 庄川峡の小牧ダム湖を遡る遊覧船。大牧温泉へは船でしか行けない
  - 長崎橋周遊コース（小牧港発着）も運航（4月〜11月、約25分）
  - 電話 0763-82-0220
  - 個人利用は予約不要、団体利用（15名以上）は事前問い合わせ
  - 所要時間 片道約30分、往復約60分
  - 年中無休（悪天候時は運休あり）
fare:
  - 大牧温泉コース 往復 大人 3,400円 / 小人 1,700円
ships:
