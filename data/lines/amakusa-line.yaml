  - 冬季・梅雨時期は火水木運休
  - 令和8年熊本地震の影響により2026年8月2日〜31日はイルカ9号・10号運休（その他の便は通常運航）
  - 所要時間：約20分
  - 予約・問い合わせ：シークルーズ TEL 0969-56-2458（営業 9:00〜17:30）
