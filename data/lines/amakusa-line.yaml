notes:
  - 時刻表はA列車（観光特急「A列車で行こう」）の運行有無により異なる
  - A列車は土日祝・長期休暇中を中心に運行
  - イルカ1号・2号は4月〜9月のみ運航（12月〜3月はA列車運行日ダイヤでも運休）
