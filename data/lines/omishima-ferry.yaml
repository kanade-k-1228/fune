fare:
  - 旅客 盛〜忠海 大人 370円 / こども 190円（片道）
  - 旅客 大久野島〜忠海・大久野島〜盛 大人 360円 / こども 180円（片道）
  - 自動車（運転者1名分含む）盛〜忠海 3m未満 1,760円・3〜4m 2,100円・4〜5m 2,640円・5〜6m 2,520円・6〜8m 3,290円・8〜9m 3,830円・9〜11m 4,400円
  - 自動車 大久野島発着 3m未満 960円・3〜4m 1,490円・4〜6m 2,030円・6〜8m 3,290円・8〜9m 3,830円・9〜11m 4,400円（片道）
  - 休日割引（土日祝 忠海〜盛直行の乗用車のみ）3m未満 1,680円・3〜6m 3,160円ほか、同乗者は無料
  - 二輪 自転車 120円・原付 260円・自動二輪750cc未満 390円・750cc以上 510円（旅客運賃別途）
ships:
  - 第三おおみしま
notes:
  - 大三島フェリー株式会社 TEL 0846-22-6199（広島県竹原市港町3-1-7）
  - 忠海港 TEL 0846-26-0853 / 盛港 TEL 0897-87-3171
  - 所要時間 忠海〜大久野島 約15分、忠海〜盛 約25〜30分
  - 大久野島は原則車両通行禁止。車両乗入れは事前に休暇村大久野島（TEL 0846-26-0321）へ連絡が必要
  - 大久野島での車両切符は休暇村大久野島フロントで販売、旅客切符は港の券売機でも購入可
  - 盛発17:00便は2月〜10月のみ大久野島へ寄港、11月〜1月は寄港しない
  - 繁忙期は大久野島への車両乗船を制限する場合あり
