  - 唐笠港からのシャトルバス（通常シーズン）またはJR飯田線（冬季）で起点に戻る
  - TEL 0265-27-2247（天龍ライン遊舟）
  - 増水・天候により運休または運航コース変更の場合あり
  - 当日窓口は現金のみ対応
