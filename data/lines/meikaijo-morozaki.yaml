fare:
  - 師崎〜篠島・師崎〜日間賀島 大人 片道800円（往復1,530円） / 小人 片道400円（往復770円）（普通運賃）
  - 篠島〜日間賀島 大人 片道500円（往復960円） / 小人 片道250円（往復480円）（普通運賃）
  - 急行料金 師崎〜篠島〜日間賀島〜師崎の各区間 大人 100円 / 小人 50円
  - 急行料金 その他区間 大人 210円 / 小人 110円
  - 往復割引 復路の運賃のみ1割引（急行料金は対象外）
  - 団体割引 15名以上1割 / 100名以上2割 / 300名以上3割（要事前予約）
  - 障がい者割引 第1種は本人と介護者5割引 / 第2種は本人のみ5割引
  - 未就学児は大人1名につき1名まで無料（2名以降は小人運賃）
notes:
  - 予約センター TEL 0569-63-2035（営業時間 9:00〜18:00 年中無休）
  - 篠島営業所 TEL 0569-67-2030（営業時間 7:00〜19:00）
  - 始発の西行1便（師崎6:25発）・東行1便（日間賀島西港6:45発）は12月〜2月の土曜・日曜・祝日および年末年始（12月29日〜1月3日）は運休
  - 日間賀島には乗場が3ヶ所（西港・東港は高速船、北港はカーフェリー）あり要注意
  - 気象状況および港湾状況等により欠航または遅れる場合あり
  - 配船の都合等により経由港で乗り換えとなる場合あり
  - 高速船は乗用車・2輪車・自転車等の車両は乗船不可
  - 各船舶とも乗船定員あり、先着順乗船
  - 可燃性品目（ガソリン・シンナー・ペンキ・高圧ガス等）やキャリーワゴン等サイズ規定違反品は持込不可
  - クレジットカード（VISA/Mastercard/JCB/NICOS/UFJCard/DC）および交通系ICカード（manaca/Suica/PASMO 等）支払可（一括のみ、師崎・河和営業所）
