name: 大島青松園
route: 高松〜大島
color: "#ba26d9"
source:
  - https://www.mhlw.go.jp/seisakunitsuite/bunya/kenkou_iryou/iryou/hansen/osima/shiptime.html
  - https://oshima-memorial-museum.go.jp/guide01/
  - https://oshima-memorial-museum.go.jp/guide02/
fare:
  - 無料（官有船）
notes:
  - 使用船：せいしょう（会期中）、まつかぜ（会期外）
  - 庵治⇔大島間の船舶は職員等の通勤専用（特定旅客航路）となり、施設見学等の来島者は高松⇔大島間の官有船を利用すること
  - 高松港第1浮桟橋から出航
  - 所要時間 約20〜30分
  - 出航時刻の5分前に船内着席
  - 天候（高波、濃霧、台風など）により欠航する場合あり
  - 問い合わせ：大島青松園高松事務所 TEL 087-871-3131（平日9:00〜17:00）
  - 瀬戸内国際芸術祭2025会期中ダイヤ：春会期 4月18日〜5月25日、夏会期 8月1日〜8月31日、秋会期 10月3日〜11月9日
  - 瀬戸内国際芸術祭2025会期外ダイヤ：5月26日〜7月31日、9月1日〜10月2日、11月10日以降
