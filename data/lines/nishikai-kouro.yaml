name: 西海沿岸商船
route: 佐世保〜大島〜松島〜瀬戸〜池島〜神浦
color: "#d92689"
source:
  - https://www.saryokyo.com/member/member-01.html
  - https://www.city.saikai.nagasaki.jp/kurashi/kotsu/2/3947.html
  - https://www.city.nagasaki.lg.jp/uploaded/attachment/9977.pdf
  - https://www.saryokyo.com/dcms_media/other/timeses.pdf
ships:
  - Rapid Lily
  - れぴーど
  - フェリーかしま
fare:
  - "高速船 佐世保〜大島: 大人1,200円 / 小人600円"
  - "高速船 佐世保〜松島: 大人1,610円 / 小人810円"
  - "高速船 佐世保〜池島: 大人2,090円 / 小人1,050円"
  - "フェリー 松島〜瀬戸: 大人240円 / 小人120円"
  - "フェリー 松島〜池島: 大人800円 / 小人410円"
  - "フェリー 松島〜神浦: 大人960円 / 小人480円"
  - "フェリー 瀬戸〜池島: 大人500円 / 小人250円"
  - "フェリー 瀬戸〜神浦: 大人720円 / 小人360円"
  - "フェリー 池島〜神浦: 大人470円 / 小人240円"
  - "定期券 佐世保〜大島: 一般43,200円 / 学生32,400円"
  - "定期券 瀬戸〜池島: 学生13,500円"
  - "自動車航送運賃: 車両長により別途 (自転車240円、原付125cc以下480円ほか)"
  - "1種身障・知的・1級精神障害者および介護者は5割引"
  - "(令和6年10月1日改定)"
notes:
  - "佐世保本社 (高速船): 0956-24-1004"
  - "大瀬戸営業所 (フェリー): 0959-22-0649"
  - "高速船は佐世保〜大島の運航が基本。火曜・金曜のみ3便・6便が松島〜池島まで延長運航"
  - "高速船の※印便 (平日18:31佐世保発・19:02大島発) は大島造船所休業日は運休"
  - "大島造船所休業日は専用ダイヤとなり、高速船7便 (16:25/16:56) は運航、9便 (18:31/19:02) は運休となる"
  - "高速船A=「Rapid Lily」、高速船B=「れぴーど」にて運航"
  - "佐世保〜大島間は月間15往復まで臨時運航することがある"
  - "フェリーは松島〜瀬戸〜池島〜神浦の各区間で月間15往復まで臨時運航することがある"
  - "高速船時刻表は令和6年4月1日施行版"
  - "佐世保港内は航路設定区間で原則追い越し禁止のため発着時刻が遅延する場合あり"
  - "令和8年10月1日より瀬戸〜松島間の運航を停止予定（フェリーは松島に寄港しなくなる見込み）"
