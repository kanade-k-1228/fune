fare:
  - 一周フリー乗船券（通常期）大人2,000円 / 小人1,000円
  - 一周フリー乗船券（繁忙期）大人2,200円 / 小人1,100円
  - 繁忙期：7月第3土曜日〜8/31、10月第2土曜日〜11月第3日曜日
  - 大人：中学生以上、小人：小学生
  - 区間乗船券・団体料金（15名以上）あり（公式サイト運賃表参照）
notes:
  - 運航期間：4月中旬〜11月30日（12月〜4月中旬は休業）
  - 所要時間約55分の周遊コース（名所おお廻り）
  - 寄港：船の駅中禅寺→(20分)菖蒲ヶ浜→(20分)大使館別荘記念公園→(10分)立木観音→(5分)船の駅中禅寺
  - 11月5日〜30日は9:00発・15:30発が運休（1日5便、他は通常どおり4港周遊）
  - 営業時間 9:00〜17:00
  - TEL 0288-55-0360（船の駅中禅寺）/ FAX 0288-55-0361
  - TEL 0288-55-0051（菖蒲ヶ浜営業所）
  - TEL 0288-55-0803（立木観音前営業所）
  - 休業期間中（12月〜4月中旬）の問い合わせ：日光湯元ロッヂ TEL 0288-62-2532
  - 天候等により運航時間変更・欠航の場合あり
