  - https://www.pref.kagawa.lg.jp/documents/8266/p05-06.pdf
fare:
  - 無料（町営渡船）
notes:
  - 運航主体：土庄町（町営渡船）
  - 所要時間：約2分
  - 12時〜13時はお昼休みで運航なし
  - 平日17:20・18:00の小江発は増発便（4/1〜9/30のみ運航）
  - スクールバス臨時便：中学校スクールバス最終便の運航時に限り、バス到着5分後に出航
  - 問い合わせ：土庄町建設課 0879-62-7006
  - 問い合わせ：土庄町企画課 0879-62-7014
  - 沖之島離島架橋事業が進行中で、令和8年度中の開通を目指して工事中（開通後は渡船廃止の見込み）
