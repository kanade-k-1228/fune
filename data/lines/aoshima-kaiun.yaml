name: 青島海運
route: 長浜〜青島
color: "#2644d9"
source:
  - https://www.city.ozu.ehime.jp/soshiki/nagahamash/0375.html
fare:
  - 旅客運賃：大人700円（片道）／1,400円（往復）、小人350円（片道）／700円（往復）
  - 身体障害者（1種）・知的障害者（A）・精神障害者（1級）および同伴介護者は50%割引（手帳提示必須。障害者手帳アプリ「ミライロID」の提示も可）
  - 小荷物運賃：10kg以下130円、10〜20kg250円、20〜30kg390円（各1個）
notes:
  - 連休や春・夏休みなどは定員超過により乗船できない場合あり
  - 離島航路のため島民優先で運航
  - 青島発16:15便（帰り）の定員超過防止のため、長浜発14:30の2便目は1便で青島へ渡った人数分、乗船定員が制限される
  - 天候不良時は予告なく欠航・出発時刻変更あり
  - 島内に商店・自動販売機なし
  - ペット同乗可（客室内へは不可。ケージに入れて船員に預ける。小荷物運賃250円/片道が必要）
  - 問い合わせ：青島海運有限会社 0893-52-2700
