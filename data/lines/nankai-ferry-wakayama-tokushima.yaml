fare:
  - 旅客 大人片道 2,500円 / 往復 4,880円
  - 旅客 小児片道 1,250円 / 往復 2,440円
  - 自動車航送 軽自動車 11,400円 (繁忙期 12,400円) ※運転者1名分含む
  - 自動車航送 普通車 13,400円 (繁忙期 14,400円) ※運転者1名分含む
  - 自転車 2,600円 (繁忙期 3,100円) ※輪行袋持込は無料
  - バイク 125cc以下 3,200円 (繁忙期 3,700円)
  - バイク 125cc超 4,400円 (繁忙期 4,900円)
  - グリーン席 WEB予約 500円 / 船内 1,000円
  - 繁忙期 2026年8月10日〜8月17日
  - 2025年10月1日より乗用車運賃を車長別から「軽自動車/普通車」の2区分に変更
notes:
  - 和歌山営業所 073-422-2156 (24時間電話予約受付)
  - 徳島営業所 088-636-0750 (24時間電話予約受付)
  - 所要時間 約2時間15分
  - 第1便は休航中 (2便〜9便のみ運航)
  - 上り7便・8便は土休日に和歌山港着時刻が5〜10分早まる (平日時刻を表示)
  - WEB予約は当日各便出航の3時間前まで (クレジットカード決済のみ)
  - Web割 5%・早割14 最大40%割引あり
  - 2028年3月末をもってフェリー事業から撤退予定
  - 2026年6月1日〜6月12日は船舶検査のため別ダイヤ
