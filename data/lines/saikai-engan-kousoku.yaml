name: 西海沿岸商船高速船（佐世保〜池島航路）
color: "#9526d9"
route: 佐世保〜大島〜松島〜池島
source:
  - https://www.city.saikai.nagasaki.jp/kurashi/kotsu/2/3947.html
  - https://www.city.saikai.nagasaki.jp/material/files/group/5/saikaiengankousokusen.pdf
  - https://www.city.saikai.nagasaki.jp/material/files/group/5/ryokakuuntinhyo.pdf
fare:
  - 佐世保〜大島：大人 1,200円／小児 600円
  - 佐世保〜松島：大人 1,610円／小児 810円
  - 佐世保〜池島：大人 2,090円／小児 1,050円
  - 大島〜松島：大人 970円／小児 490円
  - 大島〜池島：大人 1,470円／小児 740円
  - 松島〜池島：大人 800円／小児 410円
  - 定期券（佐世保〜大島）：一般 43,200円／学生 32,400円
  - 身体・知的・精神障がい者および介護者は5割引（手帳提示）
notes:
  - 運航事業者：西海沿岸商船株式会社（TEL 0956-24-1004）
  - 佐世保旅客船協会：0956-22-6575（平日 9:00〜17:00）
  - 「高速船A」＝「Rapid Lily」、「高速船B」＝「れぴーど」にて運航
  - 平日（火曜日・金曜日以外）・火金ダイヤ・大島造船所休業日ダイヤの3パターンで運航
  - 火曜日・金曜日は3便と6便が松島・池島まで延長運航（大島造船所関連）
  - 大島造船所休業日は全便「高速船B（れぴーど）」で運航
  - 大島造船所休業日の具体的な日付（カレンダー）は公式情報源で確認できなかったため、schedule には未反映（timetables には shipyard-holiday として保持。火曜日・金曜日と重なる場合の優先関係も不明）
  - 佐世保〜大島間は月間15往復まで臨時運航あり
  - 運賃は令和6年10月1日改定
  - 時刻表の（）内は到着時刻
ships:
  - Rapid Lily
  - れぴーど
