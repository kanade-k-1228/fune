ships:
  - たかしま
  - フェリーたかしま2
fare:
  - 今福〜殿ノ浦 大人 1,070円 / 小人 540円（離島住民割引 大人 540円 / 小人 270円）
  - 今福〜飛島 大人 600円 / 小人 300円（参考）
  - 飛島〜殿ノ浦 大人 340円 / 小人 170円（参考）
  - 御厨〜阿翁 大人 910円 / 小人 460円
  - 御厨〜黒島 大人 780円 / 小人 390円
  - 御厨〜船唐津 大人 590円 / 小人 300円
  - 御厨〜青島 大人 510円 / 小人 260円
  - 御厨〜阿翁 自動車航送 3m未満 1,620円 / 3〜4m 2,070円 / 4〜5m 2,530円ほか
  - 御厨〜阿翁 自転車 220円 / 原付 440円 / 自動二輪 660〜880円
  - 運賃改定 令和7年10月1日
notes:
  - 鷹島汽船 本社 (鷹島) TEL 0955-48-2327
  - 今福営業所 TEL 0956-74-0205（今福〜殿ノ浦航路）
  - 御厨営業所 TEL 0956-75-2356（御厨〜阿翁航路）
  - 1月1日は両航路とも運休
  - 今福〜殿ノ浦航路は旅客船「たかしま」で運航（車両航送不可）。所要時間 約20〜25分
  - 御厨〜阿翁航路は「フェリーたかしま2」で運航（車両航送可、定員96名）。運航距離 約19km、所要時間 約1時間15分
  - 御厨〜阿翁航路は季節により最終便の時刻が変動（夏期=4/1〜9/30 と 冬期=10/1〜3/31）
  - 御厨〜阿翁航路は毎週水曜・日曜・祝日に飛島へ寄港する変則ダイヤあり
