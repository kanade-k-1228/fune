fare:
  - 運賃は往復料金（税込）。大人（中学生以上）1,000円、小人（4歳以上）500円。
  - 団体割引あり。
  - 荷物の内容によって別途荷物料金が発生する場合あり。
notes:
  - 7〜8月（海開きシーズン）は8:00〜18:00の毎時ダイヤで運航（本ダイヤに掲載の内容）。
  - 4〜6月・9〜11月（オフシーズン）は9:00〜16:30の間で土日祝のみ運航。乗船希望日の前日までの事前予約が必須（平日利用は要相談）。
  - 冬季（12〜3月頃）の運航は要問合せ。
  - 問合せ：共同フェリー株式会社 ☎0996-72-0028（平日9:00〜17:00、12:00〜13:00・土日祝を除く）。
