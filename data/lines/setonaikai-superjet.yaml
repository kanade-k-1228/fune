fare:
  - 運賃（2025/8/1改定・1名片道・税込、2026/8/31まで）：広島港～松山観光港 大人¥8,800/小人¥4,400、呉港～松山観光港
    大人¥6,900/小人¥3,450、広島港～呉港 大人¥2,800/小人¥1,400
  - 運賃改定（2026/9/1改定・1名片道・税込）：広島港～松山観光港 大人¥9,000/小人¥4,500、呉港～松山観光港
    大人¥7,100/小人¥3,550、広島港～呉港 大人¥2,900/小人¥1,450
  - スーパーシート追加料金：大人¥800/小人¥400（石崎汽船SeaMAXにはスーパーシートなし）
notes:
  - 旅客専用高速船（車は乗船不可）
  - スーパーシートの事前予約は不可。当日窓口でのみ購入可能
  - 予約：瀬戸内海汽船予約センター 082-253-1212（9:00〜17:30）または予約専用メールフォーム（24時間受付）
  - 高速船定期検査に伴う臨時ダイヤ：2026/10/31（土）〜11/13（金）、11/16（月）〜11/20（金）は通常2隻のところ1隻運航のため一部便が減便（11/14〜15は通常ダイヤ）
