name: 契島運輸
route: 竹原〜契島
color: "#262dd9"
source:
  - https://www.toho-zinc.co.jp/chigirishimaunyu/ippanryokyaku.html
  - https://www.toho-zinc.co.jp/chigirishimaunyu/gaiyo.html
fare:
  - 車両フェリー料金（片道/往復）：3m未満 1,150/2,300円、3〜4m未満 1,780/3,560円、4〜5m未満
    2,410/4,820円、5〜6m未満 3,450/6,900円、6〜7m未満 4,190/8,380円、7〜8m未満
    4,820/9,640円、8〜9m未満 5,240/10,480円、9〜10m未満 6,280/12,560円、10〜11m未満
    6,800/13,600円、11〜12m未満 7,650/15,300円、12m以上は1m超えるごとに730/1,460円加算（危険物は5割増し）。
notes:
  - 竹原港（内港）〜契島港（東邦契島製錬株式会社）の一般旅客定期航路。フェリーおよび客船で運航、所要時間約30分（4km）。
  - 休日はフェリー便（便名 ※印）は運休し、汽船のみの運航となる。
  - 北崎港発9:10便および契島港発11:50便は危険物車両積載のため、旅客の乗船ができないことがあります。
  - 公式時刻表は各港の発時刻のみを掲載しているため、目的港の着時刻は所要時間（直行約25分、北崎経由約30分）からの推定値。
  - 竹原営業所：広島県竹原市塩町1丁目4番8号 TEL 0846-22-2628 / FAX 0846-22-4659。
  - 本社：広島県豊田郡大崎上島町東野5561番地の3。東邦亜鉛株式会社100%出資。
ships:
  - とうほう（フェリー、332t、旅客200人・トラック6台）
