notes:
  - 所要時間 約10分
  - TEL (0829) 44-2171 / FAX (0829) 44-2468
  - 本社 広島県廿日市市宮島町853番
  - 通常ダイヤのほか多客時ダイヤ、元日・1月2-3日・管絃祭の特別ダイヤあり
  - 普通車（長さ5m未満・高さ2.4m未満）は旅客便にも乗船可
  - 運航時刻は急遽変更となる場合あり、事前に要問合せ
