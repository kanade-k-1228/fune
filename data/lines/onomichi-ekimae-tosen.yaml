notes:
  - 平日・土日祝とも同一ダイヤで運航（始発 6:06／最終 22:10、尾道駅前発基準）
  - 所要時間 約5分
  - 約10〜12分間隔で運航（時刻表は目安）
  - 歩行者・自転車・125cc未満の原付のみ乗船可（自動車は乗船不可）
  - 料金は船内で乗務員に現金支払い
  - "運航会社：おのみち渡し船株式会社（TEL: 0848-38-7761）"
