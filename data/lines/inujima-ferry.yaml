name: あけぼのマリタイム
route: 宝伝〜犬島
color: "#d9269a"
source:
  - https://www.city.okayama.jp/higashiku/0000011372.html
  - https://www.akebonomaritime.com/
  - https://drive.google.com/file/d/1wT9PRhygNjQovEJM47AIUVBEt0E05kbi/view
fare:
  - 大人 400円 (片道)。2026年10月1日から600円に改定予定
  - 小人 (小学生) 200円 (片道)。2026年10月1日から300円に改定予定
  - 幼児は大人1名につき1名無料 (2人目から小人料金)
  - 荷物 10kg未満 100円 / 10kg以上20kg未満 200円 / 20kg以上30kg未満 300円 (改定後も据え置き)
  - 貸切 (チャーター) 10名まで5,000円・11名以上1人500円増 (前日までに要予約・年末年始不可)。2026年10月1日から10名まで7,000円・11名以上1人700円増に改定予定
  - 支払いは現金のみ・往復券なし・宝伝港にて支払い
notes:
  - "所要時間: 約10分"
  - 宝伝港に有料駐車場あり
  - 車は渡れません
  - 6便 (宝伝15:15発・犬島15:35発) は犬島精錬所美術館の閉館日は運休
  - 6便は3月1日〜11月30日の毎週火・水・木曜日も運休 (祝日を除く)
  - 8便 (宝伝18:30発・犬島18:45発) は日曜日運休
  - 12月30日〜1月4日は特別ダイヤで運航 (1月1日は運休)
  - 10名以上の団体や荷物が多い場合は事前連絡が必要 (定期便では対応不可)
  - 自転車・キャリーワゴン・大型荷物などは持ち込み制限あり
  - "問合せ: 株式会社あけぼのマリタイム TEL 086-947-0912 (受付 9:00〜17:00)"
ships:
  - 第七あけぼの丸
  - 第五あけぼの丸 (予備船)
