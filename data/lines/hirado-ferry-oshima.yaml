notes:
  - 所要約40分（1便的山発のみ田平経由で60分）
  - 1月1日全便運休
  - 荒天時は大島～薄香間で運航の場合あり
  - 全車両予約制（乗船10日前から受付）
  - 出航15分前までに乗船券購入・乗船待機場へ
  - 予約・問合せ 平戸切符発売所（平戸市観光交通ターミナル内）TEL 0950-23-2094
  - 大島支所 TEL 0950-55-2511
