fare:
  - adult::oneway::2,510円
  - adult::round::4,770円
  - adult::round::2,310円（離島住民割引）
  - disabled::round::680円（離島住民障がい者割引）
  - student::round::2,310円（離島出身学生割引）
  - adult::group::2,260円（団体割引・15名以上）
  - 障がい者割引（大人）1,260円 ※第1種身体・知的障がい者、第1級精神障がい者および同行の介助者1名が対象
  - child::oneway::1,260円
  - child::round::2,390円
  - child::round::1,160円（離島住民割引）
  - bicycle::oneway::1,180円
  - moto::oneway::2,370円（原付）
  - moto::oneway::2,840円（二輪自動車）
