  - car::round::21,490円〜（車両長により変動）
  - ※大人運賃は12歳以上、子ども運賃は6歳以上12歳未満
  - ※往復運賃の有効期限は乗船日を含め14日以内
notes:
  - 電話 0980-72-9209（多良間海運）
  - 所要時間 約2時間（約62km）
  - 日曜運休、悪天候時は欠航
  - 1月・2月・4月・6月・8月・10月の19日は牛セリのため平良発→多良間泊、20日 8:00 多良間発に変則
  - 12月のみ9日は牛セリのため平良発→多良間泊、10日 8:00 多良間発に変則
  - 多良間行き乗船券は平良港の乗船券売場のみ・現金のみ・予約不要
  - 受付時間（平良港・通常運航日）8:00〜8:45 / 14:45〜15:50
