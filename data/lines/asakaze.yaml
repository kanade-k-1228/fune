name: 盛運汽船
route: 宇和島〜嘉島〜戸島〜蒋淵
color: "#26d971"
source:
  - http://www.seiunkisen.co.jp/unkouannai.html
  - http://www.seiunkisen.co.jp/kyakusenshoukai.html
fare:
  - 大人 1,640円（嘉島・戸島・蒋淵方面 片道）
  - 小人 1,640円の半額 820円（小学生）
  - 団体1割引（15名以上、同一区間・同一便）大人1,480円 / 小人740円
  - 団体3割引（学校行事）大人1,150円
  - 小学生未満の幼児は大人1人につき1人無料（1歳未満は全員無料）
  - 回数券11枚で10枚分（同一区間、1年間有効）
  - 身体障がい者（第1種）・知的障がい者（A）・精神障がい者（1級）は本人と介護人ともに5割引（窓口で手帳またはミライロID提示が必要）
notes:
  - 高速艇「ゆきかぜ」で運航
  - 夏期（5/1〜9/30）・冬期（10/1〜4/30）共通ダイヤ
  - 元日（1月1日）は全便休航
  - 天候・貸切・検査（船のドック）等によって欠航や運航時刻が変更となる場合あり
  - "問い合わせ: 0895-22-4500（盛運汽船株式会社）"
  - "所在地: 〒798-0031 愛媛県宇和島市栄町港2丁目600番地15"
