fare:
  - フェリー（佐世保〜有川 2等）大人 4,570円／小児 2,290円
  - フェリー（佐世保〜有川 2等指定・加算後の合計）大人 5,520円
  - 高速船（佐世保〜有川）大人 6,840円／小児 3,430円
  - 車両航送（3m未満・運転者1名2等運賃込）17,960円〜、車長による加算あり
  - 単車125cc以下 6,220円〜750cc以上 7,860円
  - 往復割引 10%／障害者割引 50%／学生割引 20%／団体（15名以上）10%／島民割引あり
notes:
  - フェリーと高速船が運航（ドック・お盆により便数・ダイヤが変動）
  - 高速船は10/1〜2/28、最終便の時刻が繰り上がる冬ダイヤに変更（佐世保発 シークイーン17:15→16:55、シーレイディ16:10→15:50 等）
  - 所要時間：フェリー佐世保〜有川 約2時間35分／高速船佐世保〜有川 約1時間25分
  - 予約・問合せ：佐世保～上五島 0956-22-6161（平日 9:00-17:00、土曜 9:00-12:30）
  - 土曜午後・日祝・佐世保ターミナル発売所 0956-24-5326
  - 有川港ターミナル 0959-42-0035／小値賀 0959-56-3135／宇久平 0959-57-3535
  - フェリー「いのり」ドック時は「フェリーニューこしき」運航、「フェリーニューこしき」ドック時（2026年11/11〜27予定）は「いのり」運航
  - 高速船「シークイーン」ドック時（2027年2/1〜26予定）・「シーレイディ」ドック時（2026年12/5〜18予定）は代船なく運休
  - お盆期間（8月中旬）は多客期ダイヤに変動（詳細は九州商船公式サイト参照）
  - "欠航等の最終決定は出港の1時間前（運航状況: https://kyusho.co.jp/status ）"
