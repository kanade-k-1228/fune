  - 予約・問合せ：佐世保～上五島 0956-22-6161（平日 9:00-17:00、土曜 9:00-12:30）
  - 土曜午後・日祝・佐世保ターミナル発売所 0956-24-5326
  - 有川港ターミナル 0959-42-0035／小値賀 0959-56-3135／宇久平 0959-57-3535
  - フェリー「いのり」ドック時（5/15〜29予定）は「Fなみじ」運航／「FNこしき」ドック時（11/12〜28予定）は「いのり」運航
  - 高速船「シーエンジェル」ドック時（6/5〜18予定）は「シープリンセス」が代船運航
  - "欠航等の最終決定は出港の1時間前（運航状況: https://kyusho.co.jp/status ）"
