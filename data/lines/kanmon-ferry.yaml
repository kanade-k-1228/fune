  - https://www.kanmon-kisen.co.jp/route/kanmon.html
  - https://www.kanmon-kisen.co.jp/faq/
fare:
  - 大人片道 400円
  - 小児片道 200円
  - 障害者割引 大人200円 / 小児100円（第1種身障・知的障害者と介護者1名、第1級精神障害者）
  - 団体割引 15名以上で1割引
  - 自転車持込 260円
notes:
  - 所要時間 約5分
  - 日・祝日は一部便（06:15、06:40、19:30、20:30、21:50発）が運休
  - 1日乗り放題のフリーパスあり
  - 小型犬のみ同伴可（抱っこして後部デッキ乗船）
  - 門司営業所 093-331-0222
  - 下関支店 083-222-1488
