fare:
  - 大人 2,080円（片道・高速船）
  - 小人 1,040円（片道・高速船）
  - 団体（15名以上・同一区間・同一便）大人 1,880円／小人 940円（1割引）
  - 学校行事の引率大人 1,460円（3割引）
  - 回数券 11枚で10枚分（同一区間・1年間有効）
  - 小学生未満の幼児は大人1人につき1人無料（1歳未満は全員無料）
  - 身体障がい者（第1種）・知的障がい者（A）・精神障がい者（1級）は本人と介護人ともに5割引
notes:
  - 日振島内（能登・明海・喜路）に寄港（簡略表示）
  - お問い合わせ 0895-22-4500（盛運汽船株式会社）
  - 所在地 〒798-0031 愛媛県宇和島市栄町港2丁目600番地15
  - 元日（1月1日）は全便休航
  - 夏期は5月1日〜9月30日、冬期は10月1日〜4月30日（1便のみ夏冬で時刻が異なる）
  - 天候・貸切・検査（船のドック）等で欠航や時刻変更となる場合あり
