notes:
  - 東行1便・西行1便は日曜・祝日・12月31日〜1月3日・8月14日〜16日は運休
  - 西行8便（朴島〜塩竈直行便）は火曜・金曜のみ運航（祝日・12月31日〜1月3日・8月13日〜16日は運休）
  - 各便出航時刻の20分前からご乗船可能
  - 強風・高波・濃霧等の悪天候の場合は運航に支障が出る可能性あり
  - 津波注意報以上が発表された場合は運航見合わせ
  - 所要時間 塩竈〜朴島 約43分（下り）
  - 連絡先（塩竈市営汽船）022-361-7710（8:30〜17:15）
  - イベント時など、必要に応じて臨時便が出る場合あり
