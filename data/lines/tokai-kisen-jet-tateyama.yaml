notes:
  - 春の季節運航（毎年2月〜4月頃のみ）。2026年は2月7日(土)〜4月5日(日)に毎日運航
  - 多くの日は東京(竹芝)〜館山〜大島〜熱海、3/23〜4/5は東京〜館山〜大島、2/18・3/4・3/11・3/17・3/18は東京〜館山〜大島〜利島〜新島〜式根島〜神津島の各島経由便
  - 大島での途中下船ができない便（熱海行など通し運航）があるため運航日ごとに要確認
