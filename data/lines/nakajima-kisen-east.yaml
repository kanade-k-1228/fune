notes:
  - 問合せ：中島汽船 中島支店 089-997-1221（大浦港）／本社 089-952-7277
  - 松山での車両・自動二輪車・原付自転車・自転車等の乗降は三津浜港のみ可能です。
  - 潮位により車両の乗降が不可能な港があります（大浦港：089-997-1221）。
  - 三津浜港は予約できません。その他の港は予約できますが、出航30分前までに来港がない場合はキャンセル扱いになる場合があります（予約は車両のみ）。
  - 所要時間：三津浜⇄大浦 約1時間20分（フェリー）。
