notes:
  - 運航：おのみち渡し船株式会社（広島県尾道市土堂二丁目10番3号 / TEL 0848-38-7761）
  - 区間：尾道（土堂）～向島（兼吉）
  - 運航時間 6:00～22:10、5～11分間隔で運航・所要4分
  - 車両乗船可
  - 時刻表なし（乗客の乗り込みを待って随時出航）
  - 船内現金払いのみ（電子マネー・クレジットカード不可）
