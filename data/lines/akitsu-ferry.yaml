  - http://sanyo-shosen.jp/akitsu/fare.html
  - http://sanyo-shosen.jp/akitsu/inquiry.html
fare:
  - "旅客運賃: おとな 片道390円 / 往復750円、こども 片道200円 / 往復380円（こどもは小学生まで）"
  - 身体障害者・知的障害者割引は片道運賃が半額（第1種は介護者も半額、手帳提示）
  - "団体割引（15名以上 片道）: 一般おとな 360円（1割引）、学生（中学生以上）280円（3割引）、こども 180円（1割引）"
  - "自動車航送（片道）: 3m未満 1,360円 / 3m以上4m未満 1,980円 / 4m以上5m未満 2,670円 / 5m以上6m未満 4,180円 / 6m以上7m未満 5,100円 / 7m以上8m未満 6,740円 / 8m以上9m未満 7,590円 / 9m以上10m未満 8,430円 / 10m以上11m未満 9,270円 / 11m以上12m未満 10,120円 / 12m以上は1m増すごとに1,030円加算（運転者1名分の旅客運賃を含む）"
  - "二輪等（片道）: 自転車 130円、原付 280円、自動二輪750cc未満 410円、750cc以上 540円（別途旅客運賃が必要）"
  - "定期券（通勤）: 1ヵ月 14,040円 / 3ヵ月 40,020円 / 6ヵ月 75,820円"
  - "定期券（通学）: 1ヵ月 8,660円 / 3ヵ月 24,570円 / 6ヵ月 46,340円"
  - 支払いは現金のみ（クレジットカード・電子マネー不可）
notes:
  - 所要約35分、1日16往復
  - 1月1日〜3日は1便と16便を運休
  - "運航会社: 安芸津フェリー株式会社 TEL (0846)45-0462（平日 8:30〜17:00、FAX 0846-45-1553）"
  - "安芸津港 TEL (0846)45-0124 / 大西港 TEL (0846)64-3452"
  - 大型車両および低床のトラックは潮の高低により乗船できない場合あり（要問合せ）
  - トレーラーおよび総重量20トン以上の車両は乗船不可
  - 先着受付順での乗船
