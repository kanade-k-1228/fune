  - https://yasuda-gp.net/hakata
fare:
  - adult::oneway::1,300円（2025年10月1日改定）
  - child::oneway::650円（2025年10月1日改定）
  - 往復券の発売なし（帰りも都度片道分を購入）
  - 幼児(未就学児)は大人1名につき1名無料、2名以上は小人（小学生）運賃
  - 身体・知的・精神障害者は片道運賃5割引（一種・A判定・一級は本人＋介護者1名、二種以下・二級三級は本人のみ。手帳またはミライロID提示）
  - マリンワールド海の中道 入館セット券（往復乗船+入館） 大人4,600円 / 中学生3,350円 / 小学生2,250円
  - サンシャインプール 入館セット券（往復乗船+入館） 大人(高校生以上)4,100円(通常4,900円) / 中学生3,100円(通常3,900円) / 小学生2,100円(通常2,600円)
notes:
  - 所要時間 約20分、安田産業汽船株式会社運航
  - 季節・繁忙期により運航ダイヤが異なる（A=通常 / B=土日祝・夏季繁忙期 / C=GW・お盆等最繁忙期）
  - ペット・自転車（折りたたみ含む）・電動車椅子・車椅子のまま乗船不可
  - ももち券売所 092-845-1405
  - 海の中道待合所 092-603-1565
  - 天候により臨時運航の場合あり
