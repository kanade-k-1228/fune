notes:
  - 「※」の便は旅客船のため、車両（二輪車・バス・乗用車・トラック）は乗船できません。
  - 「☆」の便は第2・第4木曜日が危険物優先便となり、乗客は25名以下になります。
  - 令和8年度（2026年4月〜2027年3月）は毎月20日が旅客運賃無料デー（丸亀市による施策。自動車航送・手荷物等の運賃は対象外。乗船券は窓口で要受取）
  - 令和8年度は20日が土日祝と重なる日（6/20・7/20・9/20・12/20・2/20・3/20）に丸亀発13:20・本島発14:50の臨時便あり（フェリーほんじま丸、車両不可）
  - 本社 TEL 0877-22-2782（7:00-18:00）
  - 本島代理店 TEL 0877-27-3320（7:00-17:30）
  - 車両乗船は予約優先。予約がないと乗船できない場合あり。
