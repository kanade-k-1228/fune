notes:
  - 所要時間：約2時間25分。
  - お問い合わせ：宇和島運輸フェリー 八幡浜支店 TEL.0894-23-2536。
  - 西行2便（102便）は臼杵到着後7:00まで船内休憩可（日曜日を除く）。ただし到着時に全車両を下船・船外移動後の船内休憩となる。繁忙期は6:30まで。
  - 東行7便（207便）は指定便（危険物車両が乗船可能）。
  - 土曜日は西行4便・6便、東行4便・6便が運休となる曜日ダイヤあり。
  - 日曜・月曜日は西行1便（101便）、東行1便（201便）が運休となる曜日ダイヤあり。
