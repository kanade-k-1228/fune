name: マリックスライン
route: 鹿児島〜奄美〜沖縄
color: "#26d92b"
source:
  - https://www.marix-line.co.jp/cgi-bin/19carriage/cgi/index.cgi
  - https://marixline.com/
  - https://marixline.com/price_schedule/
fare:
  - 鹿児島〜那覇 特等 38,670円 / 1等 31,230円 / 2等寝台 22,630円 / 2等 16,350円（大人片道・燃料油価格変動調整金含む）
  - 小児は各等級の約半額
  - 学生割引 2等運賃の20%引（片道101km以上）
  - 往復割引あり
  - 自動車航送運賃には運転手1名分の2等運賃を含む
  - 奄美群島住民割引あり（名瀬/亀徳〜本部/那覇 大人2,230円、和泊/与論〜本部/那覇 大人1,620円）
notes:
  - マルエーフェリーと隔日交互運航（マリックスラインは偶数日に鹿児島新港・那覇港を出航）
  - 寄港地は名瀬（奄美大島）、亀徳（徳之島）、和泊（沖永良部島）、与論島、本部（沖縄本島）
  - 鹿児島新港〜那覇港の所要時間は約25時間
  - WEB予約はスマートフェリー（https://ferry.smaku.app/）
  - 電話予約 099-225-1551（平日 8:30〜17:00、土曜 8:30〜12:00、日祝休）
  - 本社 099-226-2121（鹿児島市錦江町1-7）
