fare:
  - 大人 片道 290円
  - 小児（小学生以下）片道 150円
  - 大人1人につき未就学児1名・1歳未満児は無料
  - 回数券 大人 11枚綴 2,900円 / 小児 1,500円
  - 通学定期（児童・園児）1箇月 3,600円 / 3箇月 10,260円
  - 通学定期（中学生・高校生等）1箇月 6,960円 / 3箇月 19,840円
  - 通勤定期 1箇月 10,440円 / 3箇月 29,760円
  - 自転車・荷車等 110円 / 原動機付自転車 210円
  - 貸切（臨時運航・主船）片道 7,300円 / 予備船 9,500円
  - 障害者割引あり（身体障害者手帳・療育手帳・精神障害者保健福祉手帳等、区分・乗船方法により割引率や対象が異なる。詳細は地域交通課へ）
notes:
  - 運航 周防大島町（産業建設環境部 地域交通課 TEL 0820-79-1015）
  - 所要時間 約15分
  - 必要に応じて臨時便を運航することがあります。臨時便は貸切運航することがあります。
  - 運賃改定 令和元年10月1日 / 時刻改正 平成30年10月1日
