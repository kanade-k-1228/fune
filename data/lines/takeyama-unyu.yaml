name: 竹山運輸
route: 平戸〜度島
color: "#26d9bc"
source:
  - https://www.city.hirado.nagasaki.jp/kurashi/life/sumai/koutu/ferry/fe02.html
fare:
  - 料金（令和元年10月1日改定）：大人片道660円、小人片道330円
  - 障がい者割引：第1種5割引（介護者も5割引）、第2種5割引（片道101km以上の場合）
  - 一般団体（15人以上）：大人570円、学生470円、小人280円
  - 通院割引：530円
  - 自転車260円、原動機付自転車530円、自動二輪（400cc未満）800円、自動二輪（400cc以上）1,050円（旅客運賃別途）
  - 車両運賃（片道）：3m未満2,340円〜12m以上1m毎に1,340円加算（運賃に1人分旅客運賃含む）
notes:
  - 時刻表は令和5年3月1日改正
  - 1月2日は1〜2便のみ運行
  - 2便（本村→平戸）および4便（本村→平戸）は飯盛港に寄港しない
  - 問い合わせ：竹山運輸（有）平戸切符販売所 TEL 0950-23-2144（7:30〜17:15）、17:15以降は0950-25-2011
