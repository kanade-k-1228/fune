  - 古仁屋待合所 0997-72-3771 / 与路待合所 0997-76-1414 / 池地待合所 0997-76-1195 / 請阿室待合所 0997-76-1175
  - 年末年始、ゴールデンウィーク等の期間及び検査（整備）ドック期間は運休
  - 各種イベント及び気象・海象等により運航時間が変更になる場合あり、乗船前に要確認
  - 欠航や時刻変更は公式X（旧Twitter）@st_liner_info でも発信
  - 寄港順は古仁屋〜請阿室〜池地〜与路（請阿室・池地はいずれも請島の港）
