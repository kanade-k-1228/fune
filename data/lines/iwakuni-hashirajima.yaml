name: 岩国柱島海運
route: 岩国〜黒島〜端島〜柱島
color: "#b726d9"
source:
  - http://ww4.et.tiki.ne.jp/~suisei-ihk/
  - https://yamaguchi-tourism.jp/access/detail_11642.html
fare:
  - "運賃（大人/小人）: 柱島〜端島 360円/180円、柱島〜黒島 1,050円/530円、端島〜黒島 790円/400円、柱島〜岩国
    1,860円/930円、端島〜岩国 1,860円/930円、黒島〜岩国 1,480円/740円"
  - "手荷物運賃: 260円"
  - 第1種身体障がい者・第1種知的障がい者（療育手帳の判定欄記載が「A」の方）・1級精神障がい者は本人と介護者1名の旅客運賃5割引
  - 小児旅客運賃は大人運賃の半額（10円未満の端数は5円以上切り上げ、5円未満切り捨て）
notes:
  - "本社・問合せ: 岩国柱島海運株式会社 〒740-0002 山口県岩国市新港町4-26-5 TEL 0827-22-8786"
  - "予約代理店: 柱島発 柱島代理店 0827-48-2405／端島発・黒島発は本社 0827-22-8786"
  - 柱島･端島･黒島から岩国への乗船は予約が必要
  - 土曜日・日曜日および 12/30〜1/4、8/13〜8/16 は上り3便（柱島14:15発）・下り2便（岩国10:00発）を増便運航
  - 岩国発15:30便は柱島直行だが復便で端島・黒島に寄港
  - "増便日（4往復運航）: お盆 2026年8月13日・14日（15日・16日は土日で別途増便）／年末年始 2026年12月30日・31日、2027年1月1日／GWは増便対象外（2026年5月4日〜6日は平日同様3往復）"
  - キャリーワゴンでの乗船は不可
