fare:
  - "旅客運賃（片道）: 一般大人1,100円・小人550円、島民大人700円・小人350円。"
  - 15名以上の団体は事前予約で10%割引。第1種身体障害者・第1種知的障害者・精神障害者1級および介護者1名は50%引き。
  - 手荷物は1人2個まで無料。自転車480円、原動機付自転車980円、自動二輪車（750cc未満）1,460円、（750cc以上）1,940円。
notes:
  - "第3便はデマンド（予約）運航。女川町内の方は就航時刻30分前までに、遠方からの方は1時間前までに電話または窓口で予約（TEL:
    0225-54-2753）。"
  - 1便または2便で江島に渡り3便で戻る場合は、乗船時に職員へ申告すること。
  - 乗船時間は出航時刻の30分前から。
  - 島からの宅急便は1・2便で発送。
  - 悪天候（強風・高波・視界不良など）の場合は欠航あり。
  - 車でお越しの際は離島航路ターミナル脇駐車場を利用（台数制限あり）。
  - 旅客船「しまなぎ」（2006年8月就航）は老朽化により就航20年を目処に引退予定（2026年7月17日発表）。後継の新造船「しまあかり」が2026年8月5日より習熟運航を開始（8月6日入魂式）。
