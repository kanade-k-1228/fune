  - 各港の時刻は出港時間。各港行きの最終到達港については到着時間
  - 各経由地の寄港地出港時間は遅れることがあり、各到着時間は前後する場合あり
  - 時刻表記載の時間以外にも臨時便（または増便）を運航することあり
  - かもめバスへ乗継割引（定期券提示で往復各200円引、乗船券・回数券利用で往復各100円引）あり
