fare:
  - 那覇〜久米島 大人片道 3,450円 / 小人 1,730円
  - 那覇〜久米島 大人往復 6,560円（復路割引 3,110円・有効31日間）
  - 那覇〜渡名喜 大人片道 2,750円 / 小人 1,380円
  - 渡名喜〜久米島 大人片道 1,160円 / 小人 580円
  - 自動車航送（那覇〜久米島・片道）3m未満 12,300円 / 5m未満 19,690円
  - 自転車 1,210円・原付（50cc以下）2,400円・自動二輪（50cc超）3,620円
  - 5歳以下は大人1名につき1名無賃。障がい者割引あり
notes:
  - 1日2便（1便は渡名喜経由）。所要時間 直行 約3時間／渡名喜経由 約3時間30分
  - 月曜日は1便のみ（午前便）の運航
  - 東行2便：1〜3月・11〜12月は月曜運休の直行、4〜10月は月・金・土を除く直行／金・土曜は渡名喜経由
  - 土曜日の渡名喜島経由運航は令和8年（2026年）4〜10月の実証実験（例年は金曜日のみ）
  - 2026年8月31日〜9月15日：フェリー海邦ドック入りのため1日1往復（往復とも渡名喜島経由）に変更、フェリー琉球のみ運航
  - "2026年10月1日より運賃を約15%改定予定（例: 那覇〜久米島 大人片道 3,450円→3,970円）"
  - 2隻のうちいずれか1隻が運航。出港15分前までに乗船
  - 乗船券の販売・予約は出発日の1ヶ月前から
  - 久米商船（株）とまりん１階 TEL 098-868-2686
  - 久米商船（株）渡名喜営業所 TEL 098-989-2479
