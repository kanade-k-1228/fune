fare:
  - adult::oneway::700円
  - adult::round::1,330円
  - child::oneway::350円（小学生）
  - child::round::670円（小学生）
  - 小学生未満の幼児は大人1名につき1名無料
  - car::oneway::3m未満 3,630円（ドライバー1名分の旅客運賃を含む）
  - car::oneway::4m未満 5,030円（ドライバー1名分の旅客運賃を含む）
  - car::oneway::5m未満 6,330円（ドライバー1名分の旅客運賃を含む）
  - car::oneway::6m未満 7,120円（ドライバー1名分の旅客運賃を含む）
  - car::round::3m未満 6,900円 / 4m未満 9,560円 / 5m未満 12,030円 / 6m未満 13,530円
  - moto::oneway::自動二輪750cc以上 2,170円 / 750cc未満 1,850円 / 原付(125cc未満) 1,430円
  - moto::round::自動二輪750cc以上 4,130円 / 750cc未満 3,520円 / 原付(125cc未満) 2,720円
  - bicycle::oneway::大人 1,070円 / 小人 720円
  - bicycle::round::大人 2,040円 / 小人 1,370円
  - group::oneway::一般 630円（10%引）/ 大高中学生（修学旅行等の学校行事のみ）490円（30%引）/ 小人 320円（10%引）、いずれも15名以上
  - モンベルクラブ会員特典：乗用車（3〜6m未満）と同乗旅客が10%引（旅客のみの利用は対象外）
notes:
  - 所要時間：約60分、距離：22km
  - 車両は事前WEB予約推奨（出航4時間前まで受付、2ヶ月前から可能、先着順）。旅客のみ・二輪車は予約不可で当日先着順乗船
  - △（1・2便）は通年予約不可・先着順
  - 平日の高松発15:10（10便）・土庄発19:30（14便）は危険物搭載車両の航送指定便のため一般旅客乗船不可
  - 3連休以上の休日は危険物搭載車両の航送指定便となる日があるため各のりばに要問い合わせ
  - 支払いは現金・クレジットカード可（2026年3月9日〜、クレジットカードは一括払いのみ。定期券・回数券の一部は利用不可）
  - 高松のりば：087-822-4383
  - 土庄のりば：0879-62-0875
  - 予約・問合せ：0879-61-1277
