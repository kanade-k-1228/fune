route: 口之津〜鬼池
color: "#26d92e"
source:
  - https://www.shimatetsu.co.jp/ferry/guide/
  - https://www.shimatetsu.co.jp/infos/detail/?id=345
ships:
  - フェリーくちのつ
  - フェリーあまくさⅡ
fare:
  - 旅客 大人 550円 / 小人 300円 (2026年3月1日〜6月30日)
  - 旅客 大人 560円 / 小人 310円 (2026年7月1日〜9月30日)
  - 障がい者 大人 300円 / 小人 180円 (2026年3月1日〜6月30日)
  - 自動車航送 3m未満 2,400円 / 3〜4m 3,100円 / 4〜5m 3,800円 (運転者1名分の旅客運賃を含む)
  - 自転車・原付 (125cc以下) 1,050円 / 自動二輪 (126cc以上) 1,250円
notes:
  - 所要時間 約30分
  - 口之津港・鬼池港 両港同時出港
  - 乗船手続きは出港時間の20分前まで
  - 船員不足のため2026年3月1日以降も冬ダイヤで運航
  - フェリー検査のため2026年6月16日〜6月26日、7月8日〜7月17日はダイヤ変更あり
  - 口之津港 TEL 0957-86-2165
  - 鬼池港 TEL 0969-32-1727
  - 船舶課 TEL 0957-61-0057
