notes:
  - 所要時間 約30分
  - 口之津港・鬼池港 両港同時出港
  - 乗船手続きは出港時間の20分前まで
  - 船員不足のため冬ダイヤで運航中（2026年8月時点）
  - 2026年8月、熊本地震による九州自動車道松橋IC〜えびのIC間通行止めに伴い、福岡・長崎〜鹿児島の迂回路（島鉄フェリー 口之津〜鬼池、三和商船 牛深〜蔵之元 経由）として利用案内あり
  - 口之津港 TEL 0957-86-2165
  - 鬼池港 TEL 0969-32-1727
  - 船舶課 TEL 0957-61-0057
