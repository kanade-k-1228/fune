name: 豊島フェリー
route: 高松〜直島（本村）〜豊島（家浦）
color: "#9026d9"
source:
  - https://www.t-ferry.com/schedule/
  - https://t-ferry.com/price/
  - https://www.t-ferry.com/ship/
fare:
  - 高松港〜豊島家浦港：大人 1,450円、小人 730円（片道）
  - 高松港〜直島本村港：大人 1,450円、小人 730円（片道）
  - 豊島家浦港〜直島本村港：大人 820円、小人 410円（片道）
  - 高松港〜豊島唐櫃港（臨時便）：大人 1,450円、小人 730円（片道）
  - 小人運賃は小学生（6〜12歳）。小学生未満は同伴1名まで無料
  - 15名以上で団体割引、障害者手帳提示で割引あり
  - 支払いは現金のみ（クレジットカード・電子決済不可）
notes:
  - 連絡先：087-851-4491（高松事務所 9:00-18:00）
  - 春夏秋季ダイヤ（3/20〜11/30）・冬季ダイヤ（12/1〜3/19）の2シーズン制
  - 直島本村港経由便は※印：月土日祝は高松発2・3便と家浦発4便、水木金は高松発3便のみ
  - 豊島美術館が開館している火曜日は水・木・金ダイヤを適用
  - 旅客定員70名・予約不可・先着順
  - 船は定刻出発のため集合時間を厳守すること
  - 乗船券販売は出航の20分前から
  - 定員超過時などに臨時便を運航する場合あり
  - 特定日に高松↔豊島唐櫃港の臨時便あり（2026年：5/3・5/4・5/5・8/10・8/11）
  - 高松〜豊島家浦港の所要時間は直行便で約35分
