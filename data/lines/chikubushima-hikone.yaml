name: 竹生島航路
route: 彦根港〜竹生島
color: "#bc26d9"
source:
  - https://www.ohmitetudo.co.jp/marine/time-price/chikubushima/
fare:
  - 乗船料（往復）：おとな（中学生以上）3,700円、こども（小学生）1,850円
  - 竹生島では入島料が別途必要：おとな600円、こども300円
  - 未就学児はおとな1名につき1名無料（2人目からはこども料金）
  - 西武プリンスクラブカード提示で乗船運賃1割引
notes:
  - インターネット予約可。空席があれば予約なしでも乗船可能（満席時は乗船不可の場合あり）
  - 彦根駅西口から無料シャトルバス運行（土・日・祝のみ）、所要約8分
  - 問い合わせ：オーミマリン彦根港支店 TEL 0749-22-0619（受付8:30〜12:00・13:00〜17:00）
  - 2026年7月13日〜9月3日は夏季特別ダイヤ。1便・3便は月〜木曜運休（8月12日・13日を除く）
