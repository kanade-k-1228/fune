name: 西三河漁協 吉良支所
route: 宮崎漁港〜梶島
color: "#d94026"
source:
  - https://www.kira-asari.com/
fare:
  - 大人：3,500円（入漁料2,000円＋渡船1,500円、税込・袋付、1袋まで）
  - 小学生：1,500円（入漁料800円＋渡船700円、税込・袋付、1袋まで）
  - 園児（小学生未満）：700円（渡船700円、税込・袋付、1袋まで）
  - 団体30名以上（大人）は200円引
notes:
  - 季節運航（潮干狩りシーズンのみ、例年3月〜5月の土日祝中心）
  - 2026年実施日：3/21, 3/22, 4/4, 4/5, 4/18, 4/19, 5/2〜5/6, 5/16, 5/17
  - 渡船開始は各日の干潮時間の2時間前、終了は干潮時間の1時間前。潮干狩り終了（梶島から戻る最終便）は干潮の1時間後
  - 干潮2時間前までに漁協（西三河漁協 吉良支所）へ到着が必要
  - 時刻表に記載のある日以外は実施しない。悪天候時は中止
  - 所要時間：宮崎漁港〜梶島（無人島）約5〜10分
  - 救命胴衣の着用必須（漁協で貸与、自己所有も可）
  - あさり採りは手カギのみ使用可（マンガ禁止）
  - 西三河漁業協同組合 吉良支所：〒444-0513 愛知県西尾市吉良町宮崎馬道57番地
  - TEL：0563-32-0224 / FAX：0563-32-0288
