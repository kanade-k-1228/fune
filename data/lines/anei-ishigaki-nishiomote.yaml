fare:
  - 大人（中学生以上）片道 2,520円 / 往復 4,880円
  - 小児（小学生）片道 1,290円 / 往復 2,500円
  - 障がい者割引 片道 1,720円 / 往復 3,440円
  - 燃料油価格変動調整金を含む
notes:
  - 安栄観光 TEL 0980-83-0055（午前6時～午後7時、台風時除く）
  - 沖縄県石垣市美崎町1番地 ユーグレナ石垣港離島ターミナル内
  - 所要時間 直行 約40〜50分 / 竹富経由 約75〜80分
  - 大型高速船「ぱいじま2」運航時は所要時間が約90〜100分となる場合あり
  - 八重山観光フェリーとの共同運航
  - 乗船券は前日18時までオンライン予約可
  - 期間内でも状況により運航時刻を変更する場合あり
  - 台風等の悪天候時は欠航
  - 6/20〜9/30は上原航路欠航時のみ運航する臨時便あり（石垣発07:00・16:30、大原発08:00・17:30）
  - 6/20〜9/30を除く期間も上原航路欠航時のみ運航する臨時便あり（石垣発07:30、大原発08:30）
  - 6/20〜9/30の石垣発08:30・16:00、大原発09:30・17:00便は、上原航路欠航時「大原港＝上原港」間の接続バスを利用可（安栄観光乗船券のみ）
