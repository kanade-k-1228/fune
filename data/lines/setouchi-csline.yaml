fare:
  - 湾内周遊料金：大人1,800円、小学生900円
  - 水上交通料金：大人600円、小学生300円
  - 団体割引（15名以上）：大人1,350円、小学生680円
notes:
  - 4〜6月・9〜12月は火曜日運休（祝日は運航、7・8月は運休日なし）
  - 4月29日〜9月30日は全7便運航、それ以外の時期は減便あり
  - 冬季間は特別ダイヤで運航
  - 天候や海の状況により運休になる場合あり
  - 出崎→浄土ヶ浜：直行約7分
  - 浄土ヶ浜→出崎：1航海約30分
  - 幼児は大人1名につき1名無料（団体除く）
  - 乗船券販売：シートピアなあど（出崎ふ頭）、浄土ヶ浜桟橋
