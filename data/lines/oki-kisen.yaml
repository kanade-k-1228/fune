notes:
  - 本社 0851-22-1122（島根県隠岐郡隠岐の島町中町）
  - 七類営業所 0852-72-2215 / 境旅客営業所 0859-44-4281
  - 西郷営業所 08512-2-2266 / 海士営業所（菱浦港）08514-2-0055
  - 西ノ島営業所（別府港）08514-7-8024 / 来居扱店（来居港）08514-8-2359
  - 予約受付時間 8:30〜17:00（本社のみ18:00まで）
  - 2等客室以外と車両・2輪車等は要予約
  - レインボージェットは予約制（出港20分前までに乗船手続き）
  - 「フェリーおき」「フェリーしらしま」のドック整備期間中は「フェリーくにが」が代わって運航
  - 高速船レインボージェットは12月1日〜翌年2月28日はドック整備のため休航
  - 船員不足により2026年6月〜2027年2月28日はフェリー2隻体制で運航（お盆期間を除く。2026年6月17日発表。従来計画より3隻体制期間を縮小）
  - フェリーおきは来居（知夫里島）に寄港しない（来居発着はフェリーしらしま・くにがを利用）
