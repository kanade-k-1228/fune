  - 毎日運航(天候により欠航あり)
  - 夏期ダイヤ(3/1〜10/31) 三笠桟橋発 9:30〜16:30 毎時30分発
  - 冬期ダイヤ(11/1〜2/末) 三笠桟橋発 9:30〜15:30 毎時30分発
  - 乗船料は乗船日により変動
