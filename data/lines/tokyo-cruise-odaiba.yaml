fare:
  - 浅草〜お台場海浜公園 大人 2,000円／小児 1,000円
  - 浅草〜豊洲 大人 1,500円／小児 750円
  - 浅草〜日の出桟橋 大人 1,000円／小児 500円
  - 日の出桟橋〜お台場海浜公園 大人 600円／小児 300円
  - 小児は6〜12歳。大人1名につき未就学児1名まで無料、2名目からは小児運賃
  - 8月の土曜日・お盆期間の17:50発（ホタルナ）・18:20発（エメラルダス）は特別便として大人3,000円／小児1,500円
  - ホタルナ利用の場合 浅草〜日の出桟橋 大人1,400円／小児700円、日の出桟橋〜お台場海浜公園 大人1,000円／小児500円
notes:
  - エメラルダス（直行・約55分）／ホタルナ（日の出経由・約65分）が運航。ヒミコは現在、豊洲には寄港していません
  - 一部の便は臨時運航
  - 気象・海象、安全訓練、法定の船舶整備等により運休する場合あり
  - ヒミコは毎月第2火曜日とその翌日、ホタルナは毎月第3火曜日とその翌日、エメラルダスは毎月第4火曜日とその翌日は運休（8月を除く）
  - 問い合わせは公式サイトのメールフォーム（info@suijobus.co.jp）から
  - 当日の運航状況は https://www.suijobus.co.jp/today-operation/ で確認
