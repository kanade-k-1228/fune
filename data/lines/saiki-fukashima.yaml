fare:
  - 蒲江〜屋形島 大人片道 310円 / 小児 160円
  - 蒲江〜屋形島 大人往復 590円 / 小児 310円
  - 屋形島〜深島 大人片道 520円 / 小児 260円
  - 屋形島〜深島 大人往復 990円 / 小児 500円
  - 蒲江〜深島 大人片道 710円 / 小児 360円
  - 蒲江〜深島 大人往復 1,350円 / 小児 690円
  - 往復券は2日間有効
  - 手・小荷物運賃 10kg以下 110円 / 10〜20kg 220円 / 20〜30kg 330円
  - 回数乗船券（片道10枚分の料金で11枚、有効期間6ヶ月）あり
  - 1・3・6ヶ月の定期乗船券あり（通勤・通学等で割引率が異なる）
notes:
  - 令和4年10月から佐伯市直営（旧運航会社の蒲江交通有限会社は定期航路事業から撤退）
  - 蒲江・深島航路事務所 TEL 0972-42-1188
  - 佐伯市役所 地域振興課 TEL 0972-22-3005
  - 第1便はスクールボート便（学校休校日は運休）、深島発
  - 1月1日・1月2日は運休
  - ドック上架時は運休（年2回：6月下旬〜7月上旬、11月下旬〜12月上旬、それぞれ約1週間）
  - 気象・海象等により欠航する場合あり
  - 時刻を定めない臨時便を年60便に限り運行する場合あり
  - 蒲江〜深島〜蒲江間の所要時間は1時間10分（屋形島2分停泊、深島6分停泊）
  - 離島航路利用者用駐車場あり（佐伯市蒲江大字蒲江浦3283番地・旧蒲江振興局跡地）
