  - 鯨瀬ターミナル（新港町8-23）— 上五島（有川・小値賀・宇久平）航路
  - 市営相浦桟橋待合所（相浦町2754-1）— 高島・黒島・津吉行き、1階待合ロビー 7:30〜18:30 年中無休
  - 港湾部みなと振興・管理課 TEL 0956-22-6127
