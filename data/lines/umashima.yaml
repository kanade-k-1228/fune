fare:
  - 大人 160 円（片道・2 区間まで）
  - 小児 80 円（小学生以下・片道・2 区間まで）
  - 回数券 大人 1,600 円 / 小児 800 円（11 枚綴り）
  - 通勤定期（1 ヶ月）大人 5,760 円
  - 通学定期（1 ヶ月）中・高校生 3,840 円 / 小学生以下 1,920 円
  - 手回り品 10kg 以下 60 円 / 20kg 以下 120 円 / 30kg 以下 180 円
  - 貸切運航 昼間 7,860 円 / 夜間 10,210 円
  - 身体障がい者（第 1 種）・知的障がい者（第 1 種）・精神障がい者（1 級）は 5 割引
notes:
  - 運航問合せ 熊南総合事務組合 0820-57-0530（FAX 0820-56-1556）
  - 実際の航路は「麻里府〜馬島〜佐合島〜佐賀」を 1 隻で巡航。本データでは麻里府〜馬島区間のみ収録
  - 麻里府〜馬島間の所要時間は約 8 分
  - 9:00 麻里府発 / 9:52 馬島発の便は 7 月 20 日〜8 月 20 日の土日祝および盆（8 月 13〜15 日）のみ運航
  - 麻里府港に無料駐車場 約 50 台
  - 手回り品は 1 人 2 個まで・3 辺合計 2m 以下かつ 30kg 以下
