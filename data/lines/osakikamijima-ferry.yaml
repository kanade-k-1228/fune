name: 大崎汽船・山陽商船
route: 竹原〜大崎上島
color: "#d95226"
source:
  - http://sanyo-shosen.jp/time.html
  - http://sanyo-shosen.jp/fare.html
  - http://www.oktravel.co.jp/
fare:
  - "旅客（竹原〜垂水）：おとな 350円 / こども 180円（片道）"
  - "旅客（竹原〜白水）：おとな 360円 / こども 180円（片道）"
  - "往復乗船券は復路1割引（10円未満切上げ・発券日より2日間有効）"
  - "身体障害者・知的障害者は片道運賃半額（第1種は介護者も半額）"
  - "自動車航送（運転者1名含む）：3m未満 1,360円〜、12m未満 10,120円、1m増すごとに 1,030円加算"
  - "自転車 130円 / 原付 280円 / 自動二輪750cc未満 410円 / 750cc以上 540円（旅客運賃別途）"
  - "定期券（竹原〜垂水）通勤 1ヶ月 12,600円 / 通学 1ヶ月 7,770円"
  - "定期券（竹原〜白水）通勤 1ヶ月 12,960円 / 通学 1ヶ月 8,000円"
  - "運賃改定：2019年10月1日改正"
notes:
  - 山陽商船 TEL:0846-22-2133（広島県竹原市港町3-1-7）
  - 大崎汽船 TEL:0846-22-2390（広島県竹原市港町2-14-24）
  - 竹原港 TEL:0846-22-2561 / 垂水港 TEL:0846-65-3471 / 白水港 TEL:0846-65-3541
  - 定期券販売：大崎フェリー同盟 TEL:0846-22-1445
  - (危)印は危険物運送便（危険物積載車両は要予約：徒歩旅客・一般車両は乗船不可。ただし一般車両で運転者のみの場合、車両甲板に乗船スペースがある時に限り乗船できる場合あり。詳細はお問い合わせください。）
  - 土・日・祝祭日・お盆（8月13日〜16日）・年末年始（12月30日〜1月4日）は普通便。ただし上記以外の日でも危険物積載車両を搭載しない場合は普通便。
  - 危険物運送便の予約：竹原海運株式会社 TEL:0846-22-2561
  - 車両積載能力を超えた車両は乗船不可。車両が満船の場合は積み残し。旅客定員も同様。
