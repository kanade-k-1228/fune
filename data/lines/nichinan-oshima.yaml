fare:
  - 旅客運賃：大人400円、子供（12歳未満）200円（片道）
  - 団体（15名以上）：2割引
  - 障がい者割引：運賃の2分の1
  - 手荷物：10kg以下100円、10〜30kg200円
  - 貸切：片道13,300円
notes:
  - 旅客定員：50名
  - 乗船10分前に手続き完了が必要
  - ペット不可（盲導犬・介助犬除く）
  - 問い合わせ：南郷町地域振興センター 0987-64-1114
  - 運休情報は日南市ホームページに掲載
