notes:
  - 予約・問い合わせ 0225-98-9038（9:00〜17:00）
  - 定期便は空席があれば予約なしで乗船可（満席時は乗船不可のことあり）。予約は運航日の2ヶ月前から受付
  - 臨時便（土曜・神社祭事時など）あり。運航日・時刻は公式サイトの運航カレンダーを参照
  - 所要約40分
  - 運航中止基準は風速12m/s以上（西寄りの風は14m/s以上）・波高2.5m以上・視程500m以下（安全管理規程より）
  - 金華山パワースポットめぐり（ガイド・昼食付）は不定期運航、前日15:00までに要予約
