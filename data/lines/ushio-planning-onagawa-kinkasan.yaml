fare:
  - 大人 往復 5,000円（片道 2,500円）
  - 小人 往復 2,500円（片道 1,250円）
  - 身体障害者手帳（1種）または療育手帳1種（A判定）保持者と介護者1名は旅客運賃50%割引
  - 海上タクシー 1〜5名 往復 30,000円、6名以上は1名追加につき 6,000円（最大12名、要電話 080-6016-1492、支払い現金のみ）
  - パワースポットめぐり（ガイド・昼食付、要事前予約） 往復 大人8,000円 小人5,400円
ships:
  - ベガ
