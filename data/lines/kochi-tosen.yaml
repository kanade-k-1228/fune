  - 無料（人・自転車・原動機付自転車・125cc以下の小型自動二輪車）
notes:
  - 高知県道弘岡下種崎線の一部（長浜渡船場〜種崎渡船場、約575m）
  - 所要時間：約5分
  - 月〜土19便、日曜18便
  - 四輪自動車および125ccを超える自動二輪車は乗船不可
  - 原動機付自転車は最大6台まで
  - 最大乗船人数57名、団体利用は事前連絡が必要
  - 運休日・運休期間の問い合わせ：高知土木事務所道路管理課 088-882-8646
  - 一般問い合わせ：高知土木事務所 088-882-8141
  - 2025年7月1日より新造電気推進船「浦戸」が就航し、運航時刻が変更
