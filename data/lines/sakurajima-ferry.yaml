  - 自動車航送（5m以上6m未満）2,630円
  - 自動車航送（6m以上7m未満）2,940円
  - 回数券36枚綴 大人7,000円・小児3,640円
notes:
  - 鹿児島港〜桜島港 所要時間 約15分（気象・海象により20分程度になる場合あり）
  - 平日94便・土日祝104便（2025年10月1日改正）
  - 2026年8月22日・29日（土）は17時台・18時台の一部便が通常の土日祝ダイヤと異なる臨時ダイヤで運航
  - お問い合わせ 鹿児島市船舶局 099-293-2525
