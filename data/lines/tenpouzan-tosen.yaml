fare:
  - 無料（大阪市の渡船はすべて無料）
notes:
  - 天保山渡船場 06-6571-5919
  - 大阪市建設局 河川・渡船管理事務所 06-6536-5295
  - 所要時間は約3分（岸壁間約400m）
  - 1月1日は休航
  - 台風・大雨などの荒天時は運休する場合あり
  - 自転車・125cc以下の二輪車も乗船可
