name: 湯島商船「昭和丸」
route: 江樋戸〜湯島
color: "#26b1d9"
source:
  - https://www.city.kamiamakusa.kumamoto.jp/q/aview/406/21239.html
fare:
  - "運賃（片道）: 大人（中学生以上）800円、小人（小学生）400円"
  - "幼児（未就学児）: 0歳は無料。大人1名の同伴につき1人目は無料、2人目以降は1人400円"
  - 障がい者等は大人運賃の半額（手帳提示必要）
notes:
  - 年中無休で運航
  - 予約不可。定刻になると離岸するため時間に余裕をもって乗り場へ
  - 支払いは現金のみ。切符・券売機なし。乗船後に乗務員が徴収
  - "問い合わせ: 昭和丸 TEL:0964-56-4060、菊盛丸 TEL:090-3199-4752"
  - 奇数日・偶数日で船舶が毎月交互に切り替わる
  - 車椅子での乗船は菊盛丸のみ対応（事前連絡要）
  - 江樋戸港駐車場満車時は道の駅さんぱーるまたは宮津海遊公園の駐車場を利用
