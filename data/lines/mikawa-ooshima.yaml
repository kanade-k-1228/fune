name: 三河大島航路
route: 蒲郡〜三河大島
color: "#47d926"
source:
  - https://www.gamagori.jp/spot/760/
  - https://www.gamagori.jp/gwp/wp-content/uploads/2020/09/R7%E4%B8%89%E6%B2%B3%E5%A4%A7%E5%B3%B6%E5%AE%9A%E6%9C%9F%E8%88%AA%E8%B7%AF%E6%99%82%E5%88%BB%E8%A1%A8.pdf
fare:
  - 往復 大人（中学生以上）1,600円
  - 往復 小人（小学生）800円
  - 幼児は大人1人につき1人無料、2人目から小人料金
  - 団体割引（15名以上）往復 大人1,440円 / 小人720円
notes:
  - 運航は夏季のみ（海水浴シーズン）。令和7年は7/22〜8/20に運航
  - 蒲郡→東浜→西浜→蒲郡の順に停泊（降り間違い注意）
  - 悪天候などにより運休する場合や、東浜・西浜のどちらかで乗船・下船する場合あり
  - 潮位の関係で西浜に停泊できない便あり（その場合は東浜のみ停泊）
  - 所要時間 蒲郡〜東浜 約10分／東浜〜西浜 約5分
  - 連絡先 一般社団法人蒲郡市観光協会 TEL 0533-68-2526（平日）/ 0533-79-6526（土日祝）
  - 連絡先 蒲郡市産業振興部観光まちづくり課 TEL 0533-66-1120
  - 運航 蒲郡観光汽船（伊藤造船）TEL 0533-68-3456
