fare:
  - "大人 アプリ決済 2,000円 / 現地決済 2,500円"
  - "小児（3歳〜小学生） アプリ決済 1,000円 / 現地決済 1,250円"
  - "障がい者割引 大人 アプリ決済 1,000円 / 現地決済 1,250円"
  - "障がい者割引 小児 アプリ決済 1,000円 / 現地決済 1,250円"
  - "3歳未満の幼児は大人1人につき1名無料（座席利用可）、2人目から小児運賃"
notes:
  - 2025年7月26日定期運航開始（旧大分ホーバーフェリー航路の復活）
  - 波高・濃霧などにより運休となる場合あり
  - 所要時間約35分
  - 平日・土日祝 同一スケジュール（空港アクセス便）
  - オンライン予約はスマホ専用アプリまたはLINE友達追加から
  - 予約締切は乗船の20分前まで、来館目安は出航15〜20分前
  - 土日祝日は別府湾周遊便（西大分13:30発→14:00着）も運航
  - 土曜日は空港周遊便も運航
  - 予約終了後も残席があれば窓口での購入可能
  - 大分駅〜西大分ターミナル間で無料シャトルバス運行（所要約10分）
  - 船内にトイレなし、ペット乗船不可（補助犬を除く）
  - "西大分ターミナル営業時間: 7:30～18:00（TEL: 097-547-7171）"
  - "空港ターミナル営業時間: 9:00～17:00（TEL: 0978-67-0039）"
  - "問い合わせ: 097-547-9515（平日9:00〜17:00）"
