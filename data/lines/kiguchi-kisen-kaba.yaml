name: 木口汽船
route: 福江島〜椛島
color: "#26d9d5"
source:
  - https://www.kiguchi-kisen.jp/contents/timetable/
  - https://www.kiguchi-kisen.jp/
fare:
  - 旅客運賃：福江〜伊福貴 大人810円・子供410円、福江〜本窯 大人830円・子供420円、伊福貴〜本窯 大人240円・子供120円
  - 国境離島島民割引あり（福江〜伊福貴 大人380円、福江〜本窯 大人380円、伊福貴〜本窯 大人170円）
  - フェリーひさか（椛島航路）の自動車航送運賃：3m未満5,440円〜
  - 障害者割引制度あり（各種手帳・ミライロID対応）
notes:
  - ソレイユ（旅客船）が通常ダイヤを運航
  - ソレイユ上架時・嵯峨島代船時はシーガルが代替運航（3便の時刻が異なる）
  - ソレイユは2026年10月26日〜11月1日にドック入り予定（シーガル代替運航、変更の可能性あり）
  - 黄島代船時は1便シーガル・2・3便ソレイユで通常ダイヤと同時刻
  - フェリーひさかは毎月12日・17日のみ福江〜本窯間を運航（車輌は要予約）
  - ソレイユ・シーガルは自動車航送不可
