ships:
  - かなや丸
  - しらはま丸
fare:
  - 旅客（片道）大人 1,100円 / 小人 550円
  - 旅客（往復・帰り割引後）大人 2,000円(帰り900円) / 小人 1,000円(帰り450円)
  - 幼児（6才未満）大人または小人1名につき2名まで無料
  - 自動車航送（片道・運転者1名含む）軽自動車（660cc・4m未満）4,300円 / 普通車（6m未満）5,400円
  - 自動車航送（片道・運転者1名含む）中型車（7m未満）8,300円 / 大型車（9m未満）10,300円 / 特大車（12m未満）13,700円
  - オートバイ（片道）750cc以上 3,400円 / 750cc未満 2,850円
  - 原付自転車（125cc未満・片道）2,400円
  - 自転車（片道）大人 1,850円 / 小人 1,300円
  - 障がい者割引（本人と介護者1名、片道旅客運賃半額）大人 550円 / 小人 280円
  - 団体割引（15名以上・片道）一般 900円 / 大高中学生(学校団体) 750円 / 小学生・幼稚園児 450円
  - 回数券（旅客・8枚つづり・6か月有効）大人 7,700円 / 小人 3,850円
  - 通勤定期 1か月 39,600円 / 3か月 108,900円 / 6か月 198,000円
  - 通学定期 1か月 26,400円 / 3か月 69,300円 / 6か月 118,800円
  - グリーン室（1室ルームチャージ・かなや丸/しらはま丸、大人20名まで）3,500円
notes:
  - 所要時間 約40分
  - 久里浜港 046-835-8855
  - 金谷港 0439-69-2111
  - 本社 046-830-5622
  - 平日はBダイヤ（7往復）、土日祝と夏季繁忙期はAダイヤ（14往復）が中心だが、月ごとに例外・部分運休あり。最新の運航ダイヤは公式サイトのカレンダーを確認
  - 遊覧割引あり（1往復のみ・相手港には下船不可、詳細は公式サイト参照）
