  - child::half::大人運賃の半額（6歳以上12歳未満、10円未満切り上げ）
  - infant::大人同伴で1人無賃、超過分は半額（1歳以上6歳未満）
  - disabled::5割引（身体障害者手帳1種・療育手帳A、要手帳提示、フェリー車両は対象外）
  - group::1割引（15名以上・一般）
  - group::student::3割引（15名以上・中学生以上大学生以下）
  - group::child::1割引（15名以上・小学生以下）
