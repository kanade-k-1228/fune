  - car::2,620円（4〜5m未満、運転者1名込・常石〜歌）
  - car::3,950円（5〜6m未満、運転者1名込・常石〜歌）
notes:
  - "運航: 備後商船株式会社（広島県福山市沼隈町常石1083、TEL 084-987-2711 / FAX 084-987-2710）"
  - 自動車航送はフェリー便のみ、常石港・福田港・歌港の3港間に限る（尾道港・戸崎港・満越港では自動車の乗降不可）
  - 高速船は歌港には寄港しない
  - 自動車乗船の予約は受け付けず、各港で並んだ順に乗船
  - 9m以上の車両は事前連絡必須（構造により乗船不可の場合あり）
  - 自転車・原付は高速船は最大3台まで、大型二輪はフェリー利用
  - 平成28年7月1日改定の時刻表
  - 週末・休日はフェリー便で車両の積み残しが発生しやすい。早めの来港、または常石港・歌港の駐車場利用を推奨
