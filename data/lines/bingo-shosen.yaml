  - moto::300円（原付）
  - moto::440円（自動二輪750cc未満）
  - moto::600円（自動二輪750cc以上）
  - car::910円（3m未満、運転者1名込・常石〜福田）
  - car::1,320円（3〜4m未満、運転者1名込・常石〜福田）
