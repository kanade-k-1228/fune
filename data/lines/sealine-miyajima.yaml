name: 瀬戸内シーライン
route: 宇品〜宮島
color: "#ac26d9"
source:
  - https://setonaikaikisen.co.jp/kouro/highspeedship/
fare:
  - 運賃（片道・税込）：広島港〜プリンスホテル港 大人1,450円・小人730円、広島港・プリンスホテル港〜宮島港
    大人2,300円・小人1,150円（2025年4月1日現在）
  - 2023年10月1日より宮島訪問税（1人100円）が別途必要
  - 令和8年(2026年)9月1日に運賃改定予定（片道：広島〜プリンスホテル港 大人1,570円・小人790円、広島・プリンスホテル港〜宮島
    大人2,500円・小人1,250円、往復：広島・プリンスホテル港〜宮島 大人4,800円・小人2,400円。宮島訪問税は別途）
notes:
  - 旅客船のみの運航（車両乗船不可）
  - 土日祝ダイヤ（3〜11月）は▲便も運航。12月〜2月は▲便運休
  - 宮島発最終便（東行き8便）はプリンスホテル港経由広島港行き
  - 出航30分前から受付開始、出航5分前までに手続き完了が必要
