  - https://www.city.toride.ibaraki.jp/mizutomidori/bunkakatsudo/kanko/kankomesho/ohorinowatashi.html
fare:
  - 料金：大人200円（一周400円）・小学生100円（一周200円）・自転車1台目無料
notes:
  - 取手市営の渡し船。利根川を挟み市内中心部と小堀（おおほり）地区を結ぶ
  - 河川増水・強風時は欠航
  - 小堀地区居住者・未就学児・介護が必要な者と介護者は無料
  - 定員12名、予約不可
