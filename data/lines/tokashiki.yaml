  - 受付時間 10:00〜17:00
  - 乗船券の発券・購入は乗船当日のみ。出港30分前までに購入要
  - 小学生未満の幼児は大人1名につき1名無料
  - GW・7〜9月の金土日はマリンライナー13:00便を追加運航
  - 2026年10月1日から運賃改定予定（フェリーとかしき大人片道1,690円→2,200円、マリンライナーとかしき大人片道2,530円→3,300円等）
