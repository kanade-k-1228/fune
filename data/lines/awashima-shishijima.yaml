notes:
  - 粟島汽船株式会社 TEL 0875-83-3204
  - 三豊市詫間町詫間 6807-10
  - 所要時間 須田〜粟島 約15分、粟島〜上新田 約15分、上新田〜志々島 約15分、志々島〜宮ノ下 約20分
  - 須田〜志々島間の利用は粟島で乗り換え
  - 宮の下港は船内で切符を購入
  - 天候等の事情で予告なく変更・運休する場合あり
