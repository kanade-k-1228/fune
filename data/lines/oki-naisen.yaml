name: 隠岐観光（島前内航船）
route: 知夫里島〜西ノ島〜中ノ島
color: "#d97726"
source:
  - https://www.okikankou.com/inter-island-ferry/
  - https://www.town.nishinoshima.shimane.jp/files/original/20251222110546529243da3c7.pdf
  - https://www.town.nishinoshima.shimane.jp/files/original/20251222110507339df375d6f.pdf
fare:
  - 旅客運賃 大人片道300円 小人片道100円（いそかぜ・フェリーどうぜん共通）
  - 回数券（11枚綴り）3,000円
  - フェリーどうぜん 自動車航送運賃 5m未満1,000円 / 6m未満1,500円 / 7m未満2,000円 / 8m未満2,500円 / 9m未満3,000円 / 10m未満3,500円 / 10m以上3,000円+1m毎500円加算
notes:
  - 島前3島（知夫里島・西ノ島・中ノ島）を結ぶ内航船
  - 「いそかぜ」(旅客のみ・定員70名) と「フェリーどうぜん」(車両積込可・旅客定員100名・車両約10台) の2隻で運航
  - 隠岐汽船フェリーの就航隻数（2隻/3隻）に応じてダイヤが変動
  - 予約不可・全便先着順
  - 需要に応じ通常ダイヤに影響を及ぼさない範囲で臨時便を運航することがある（貸切運航となる場合あり）
  - 隠岐観光（株）本社 08514-6-0016
  - 隠岐観光（株）別府営業所 08514-7-8412（8:00〜17:00）
  - 隠岐観光（株）菱浦営業所 08514-2-0272
  - 総合案内窓口 050-3172-1521
ships:
  - いそかぜ
  - フェリーどうぜん
ports:
