  - 車両は前日までに全便予約制
  - 第1火曜日のみダイヤが異なる
  - 木曜日のみ日中便がフェリーに変更されダイヤが異なる
  - 金曜日（4/1〜9/30）は旅客船最終便が延長
  - 天候により欠航の場合あり
