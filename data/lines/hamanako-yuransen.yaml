fare:
  - 大人（中学生以上）1,600円
  - 小人（小学生）800円
  - 未就学児は大人1名につき1名まで無料（追加は小人運賃）
  - 障がい者手帳・療育手帳所持者本人と付添1名は5割引
notes:
  - 浜名湖を約30分周遊する遊覧船（双胴船）。乗船した港が始発の便は、直行（約5分）で対岸下船するか、周遊して同じ港に戻るか選べる
  - 瀬戸航路（かんざんじ〜みっかび瀬戸）は現在運航休止・再開未定
  - 水曜定休（祝日・GW・お盆・シルバーウィーク・年末年始は運航）
  - 2026年は7月22日・29日、8月の水曜（8/5・8/12・8/19・8/26）も臨時営業
  - かんざんじ港 TEL 053-487-0228
  - フラワーパーク港 TEL 053-487-1036
