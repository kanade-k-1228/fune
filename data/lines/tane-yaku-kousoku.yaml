fare:
  - "鹿児島⇔種子島（西之表）: 大人 片道 12,000円 / 小児 6,000円、往復割引 大人 22,200円 / 小児 11,100円（往復券は7日間有効）"
  - "鹿児島⇔屋久島（宮之浦・安房）: 大人 片道 14,000円 / 小児 7,000円、往復割引 大人 25,900円 / 小児 12,950円"
  - "種子島⇔屋久島: 大人 片道 6,200円 / 小児 3,100円、往復割引 大人 11,400円 / 小児 5,700円"
  - 小学生は大人運賃の半額、未就学児は大人1名につき1名無料（座席不要）
  - 障害者手帳・学生証等による割引制度あり（公式サイト参照）
  - 運賃には燃料油価格変動調整金を含む
notes:
  - "運航会社: 種子屋久高速船株式会社（トッピー&ロケット）"
  - "予約センター Tel: 0570-004015（9:00～17:30、土日祝 9:00～17:00）"
  - "鹿児島営業所（鹿児島本港南埠頭）: 〒892-0814 鹿児島市本港新町5、窓口 6:30～17:00"
  - "西之表営業所: 〒891-3111 西之表市西町49-1、窓口 7:00～17:00（土・月 6:00～17:00）"
  - "宮之浦営業所: 〒891-4205 熊毛郡屋久島町宮之浦1208-11、窓口 8:30～17:00"
  - "安房営業所: 〒891-4311 熊毛郡屋久島町安房176-1、窓口 6:00～7:00 / 12:00～13:10"
  - 季節ごとに4つのダイヤ（春・夏・秋・冬）が設定される。一部便は曜日運航・運休あり
  - 安房（屋久島）発着便は当航路（宮之浦経由）の停留所には含まれず、別途運航
  - 指宿経由便は2026年4月1日より指宿港寄港を休止中
