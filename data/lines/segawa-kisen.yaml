name: 瀬川汽船
route: 佐世保〜横瀬西〜小郡〜畑下〜川内
color: "#269dd9"
source:
  - http://segawakisen.co.jp/segawajikokuhyo.html
  - http://segawakisen.co.jp/segawaunchin.html
fare:
  - 大人片道：佐世保〜横瀬西 750円、佐世保〜小郡 850円、佐世保〜畑下 900円、佐世保〜川内 920円
  - 横瀬西〜小郡 230円、横瀬西〜畑下 310円、横瀬西〜川内 390円
  - 小郡〜畑下 170円、小郡〜川内 230円、畑下〜川内 170円
  - 小児運賃は大人運賃の半額（5円未満切り捨て・5円以上切り上げ）
  - 回数券（11枚綴）：佐世保〜川内 9,200円、佐世保〜畑下 9,000円、佐世保〜小郡 8,500円、佐世保〜横瀬西 7,500円
  - 通勤定期 1ヶ月：佐世保〜川内 33,120円、〜畑下 32,400円、〜小郡 30,600円、〜横瀬西 27,000円
  - 通学定期 1ヶ月：佐世保〜川内 22,080円、〜畑下 21,600円、〜小郡 20,400円、〜横瀬西 18,000円
  - 団体15名以上1割引、学生団体15名以上は大人3割引・小児1割引
  - 障害者割引（手帳提示）：5割引
  - 自転車の積載は現在取扱不可
  - 令和8年4月1日改定（消費税10%込）
notes:
  - 問い合わせ：TEL 0959-32-1770 / FAX 0959-32-0678
  - 本社所在地：〒851-3509 長崎県西海市西海町横瀬郷4107-7
  - Eメール info@segawakisen.co.jp
  - ◎印は毎週日曜日および祝日は休航（日祝の始発は横瀬西発7:10、最終は佐世保発19:00）
  - 1月1日は全便休航
