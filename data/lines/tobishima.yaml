fare:
  - 大人(中学生以上) 片道 2,140円 / 往復 4,280円
  - 子ども(小学生・幼児) 片道 1,070円 / 往復 2,140円
  - 身体障がい者等 片道 1,070円 / 往復 2,140円
  - 乳児(1歳未満) 無料、幼児は大人1名につき1名無料
  - 団体(15人以上) 大人往復 3,860円、子ども往復 1,930円
  - 学生等団体(15人以上) 大人往復 2,990円、子ども往復 1,930円
  - 島民 大人片道 1,500円、子ども(小学生)片道 750円
notes:
  - 酒田市定期航路事業所 TEL 0234-22-3911 / FAX 0234-22-3912
  - 受付時間 10:00〜17:00
  - 酒田〜飛島約39km、所要時間 約75分
  - 事前予約が必要(出発1ヶ月前〜1日前まで電話またはインターネットで)
  - 10月〜3月は毎日1航海、4〜9月は時期により2航海（8月は毎日2航海）
  - 出欠航は出航1時間前に決定し、公式サイトに掲載
  - 2航海の場合は事前に電話予約が必要
  - 定期船「とびしま」は2026年3月26日発生のエンジントラブル（左舷エンジンの重要部品破損）により長期休航中。代船「シープリンセス」が運航（2026年7月22日〜8月31日予定、以降の運航体制は調整中）。時刻は通常ダイヤに準じる
  - 代船運航中は船内の安全確保のため手荷物制限あり（重量30kg以内・長さ2m以内）
