fare:
  - 大人2等 片道 3,800円 / 往復 7,600円
  - 車両3M未満 15,500円（運転手1名・2等運賃込み）
  - 車両3M以上4M未満 18,500円（運転手1名・2等運賃込み）
  - 同乗者乗船不可・人のみの乗船不可
  - 運賃は燃料油価格変動調整金・消費税込み（2025年10月1日改定）
notes:
  - カーフェリー貨物便
  - 1日1往復
  - 不定期の貨物フェリーのため運航日が限られる場合あり（運航日は公式サイト「運航・予約状況」で要確認）
  - ドライバー含め最大12名のみ乗船可
  - 食堂・売店・自販機・シャワーなし
  - 鹿児島 099-261-7000 / 種子島 0997-22-1355
  - 種子島の受付時刻は通常 11:30〜11:45
  - 車輌航送は電話予約のみ（ネット予約不可）
