fare:
  - 旅客 大人 550円 / 小人 280円（片道）
  - 車両 3m未満 1,550円〜12m未満 8,600円（1m増すごとに+950円、運転手1名分の旅客運賃を含む）
  - 二輪車 125cc未満 880円 / 125cc以上 1,030円 / 750cc以上 1,230円
  - 自転車 大人 680円 / 小人 540円
  - 車に同乗の旅客は車両1台につき4名様まで半額
  - 2024年8月1日改定
notes:
  - 所要時間 約35〜40分
  - 鴨池営業所 099-256-1761
  - 垂水営業所 0994-32-0001
  - 平日と土日祝でダイヤが異なる
  - 週末ダイヤ（土・日・祝、および土日前後の祝日・振替休日）は2026年7月18日改正
  - 着時刻は公式非公表のため、所要時間約40分からの算出値
