name: 杢兵衛造船所「一番丸」
route: 大津港〜におの浜観光桟橋（一番丸コース）
color: "#268ad9"
source:
  - https://lakewest.jp/lago-cruise-ichibanmaru/
  - https://lakewest.jp/lago-cruise/
  - https://otsu.or.jp/thingstodo/experience-activity_spot60
fare:
  - 大人（中学生以上）片道 1,000円 / 往復 2,000円（往復は下船不可・停泊中は船内待機）
  - 小人（小学生）片道 500円 / 往復 1,000円（往復は下船不可・停泊中は船内待機）
  - 幼児（小学生未満）大人1名につき1名無料
notes:
  - 土日祝日を中心に運航（詳細は公式運航カレンダー要確認）
  - 8〜10月は6便目（16:20発・16:50発）を運航
  - 所要時間：片道約20分
  - 火曜日定休（レークウエストヨットクラブ）
  - キャッシュレス決済のみ（クレジットカード・QUICPay・QR決済、現金不可）
  - 身体障がい者割引：手帳提示で本人＋付添人1名 通常料金10%引（貸切利用は対象外）
  - 団体割引：30名以上で1名あたり通常料金10%引（他の割引との併用不可）
  - 往復乗船券は におの浜観光桟橋発 11:50便・最終便は販売なし
  - 問い合わせ：レークウエストヨットクラブ TEL 077-572-2114（8:30-17:30）
