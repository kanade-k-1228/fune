name: 岐阜市（小紅渡船船頭組合）
route: 小紅の渡し
color: "#26a1d9"
source:
  - https://www.gifucvb.or.jp/sightseeing/detail_kankou.php?eid=00026
  - https://ja.wikipedia.org/wiki/%E5%B0%8F%E7%B4%85%E3%81%AE%E6%B8%A1%E3%81%97
fare:
  - 料金：無料
notes:
  - 岐阜市が運営する長良川の渡し船（岐阜県道173号の一部）
  - 小紅渡船船頭組合が運営（船頭は曜日ごとの担当制・3人体制）
  - 時刻表なし・随時出発（呼べばすぐ出航）
  - 月曜が祝日または21日の場合は翌日休航
  - 悪天候・増水時は欠航（渡船小屋に赤旗が上がる）
  - 問い合わせ：岐阜市土木管理課 058-214-4719
