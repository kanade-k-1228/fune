fare:
  - 小倉〜藍島：大人 600円 / 小児 300円 / 障害者・年長者 300円
  - 小倉〜馬島：大人 420円 / 小児 210円 / 障害者・年長者 210円
  - 馬島〜藍島：大人 180円 / 小児 90円 / 障害者・年長者 90円
  - 11回券（普通運賃の10倍）：小倉〜藍島 6,000円、小倉〜馬島 4,200円
  - 通勤定期（1ヶ月）：小倉〜藍島 7,920円、小倉〜馬島 5,550円
  - 通学定期（高校生以上、1ヶ月）：小倉〜藍島 3,700円、小倉〜馬島 2,640円
  - ペア切符（大人2名往復）：小倉〜藍島 2,000円、小倉〜馬島 1,400円
  - ファミリー切符（大人2名・小児2名往復）：小倉〜藍島 3,000円、小倉〜馬島 2,000円
  - 団体割引（15名以上）：一般1割引、学生5割引
  - 手荷物：15kg以内かつ0.7立方メートル以内のものは1個まで無料
notes:
  - 所要時間：小倉〜馬島 約25分、小倉〜藍島 約40分
  - 混雑が予想される土日祝・お盆・船舶ドック時の代船運航期間は、小倉発便の出港1時間前から乗船整理券を配布し、整理券のない方は乗船不可
  - 整理券配布の有無は出港1時間前に小倉待合所建物入口横に掲示
  - 夏季ダイヤ適用期間：7月20日〜8月12日
  - お盆ダイヤ適用期間：8月13日〜15日
  - 年始ダイヤ適用期間：1月1日〜4日
  - 問い合わせ：小倉分室 093-531-1712 / 渡船事業所 093-861-0961
ships:
  - こくら丸（2017年5月就航、95.00 G.T.、旅客定員150名、バリアフリー対応船）
