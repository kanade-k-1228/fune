name: 笠岡〜白石島〜北木島（金風呂丸）
color: "#d9268e"
route: 笠岡〜白石島〜豊浦〜金風呂
source:
  - https://setouchi-csline.jp/
  - https://www.city.kasaoka.okayama.jp/site/japan-heritage/54830.html
ships:
  - 第二十一金風呂丸
fare:
  - 笠岡〜白石島 大人 550円 / 小人 280円
  - 笠岡〜北木島（豊浦・金風呂）大人 550円 / 小人 280円
  - 白石島〜北木島 大人 240円 / 小人 120円
  - 自転車 200円（笠岡〜北木島）/ 110円（白石島〜北木島）
  - 原付 380円 / 220円
  - 自動二輪（〜750cc）570円 / 350円
  - 自動二輪（750cc超）750円 / 460円
  - 自動車（3m未満）1,840円〜（長さに応じて段階加算）
  - 往復割引・団体割引（15名以上）あり
notes:
  - 運航：瀬戸内中央観光汽船株式会社
  - TEL 0865-62-2856（代表）/ 0865-63-2033（事務所）
  - 笠岡港の発着は伏越港（旅客船の住吉港とは別）
  - 所要時間：笠岡〜白石島 約47分、笠岡〜北木島 約60分
  - 切符は船内で購入（事前販売なし）
  - 7月21日〜8月31日の土・日・祝日は月・水・金ダイヤ（1日4便）で運航
  - 必要に応じて月・水・金運航の第2便を臨時便として運航する場合あり
  - 全長10m以上の車両は白石島に着岸不可
