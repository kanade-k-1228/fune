fare:
  - 大人280円・子供140円（片道）
  - 大人540円・子供270円（往復、大島発のみ）
  - 国境離島割引（島民割引カード所持者）：大人200円・子供100円（片道）
notes:
  - 1便・7便は日曜運休
  - 定員54名、予約不要
  - 冬季ダイヤ（11月1日〜2月末日）は7便の時刻のみ変更（1・3・5便は通常どおり）
  - 週末・祝日の指定日に運航される「野崎方面 4便（増便）」の日は、5便の時刻が笛吹12:15発・大島12:25着/12:30発・笛吹12:40着に変更（指定日は町公式サイトの運航カレンダーPDFを参照）
  - 問合せ先：はまゆう 090-4984-8025、小値賀町役場 0959-56-3111
