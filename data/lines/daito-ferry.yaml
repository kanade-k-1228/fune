fare:
  - 那覇〜南北大東島 大人 5,790円 / 小人 2,900円（片道）
  - 那覇〜南北大東島 学生 4,640円 / 障がい者 2,900円（片道）
  - 那覇発往復 大人 11,010円 / 小人 5,510円
  - 島発往復（那覇着）大人 9,850円 / 小人 4,930円
  - 南大東島〜北大東島 大人 870円 / 小人 440円 / 障がい者 440円（片道）
  - 沖縄県離島住民割引運賃カード保有者（南北大東島発） 大人 250円 / 小人 140円 / 障がい者 140円 / 障がい者小人 70円 / 離島出身学生 250円
  - 支払いは現地窓口にて現金のみ
notes:
  - 月別ダイヤで南先航・北先航を交互運航（4日サイクル）
  - 那覇は16:00〜16:30 乗船
  - 予約必須・前月20日 8:30 から受付
  - 那覇発乗船受付 098-861-0515（FAX 098-862-3734）
  - 南大東島発 09802-2-2003 / 北大東島発 09802-3-6062
  - 那覇〜南大東島 約15時間（那覇17:00発・翌日8:00着）
  - 気象海象で変更が多いため余裕を持った計画推奨
  - 2026年8月17日(月)〜21日(金)は「だいとう」残工事ドック入りのため運休（8月22日北先航便より運航再開予定）
  - 乗船券取消は出港前に限り運賃の3割手数料で払戻可（出港後は払戻不可）
