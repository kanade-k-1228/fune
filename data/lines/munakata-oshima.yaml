fare:
  - 大人 片道 570円 / 小児（1歳〜小学生）片道 290円
  - 回数旅客運賃（11枚綴り・60日間有効）：大人 5,700円 / 小児 2,900円
  - 通勤定期：1か月 20,520円 / 3か月 58,490円 / 6か月 110,810円
  - 通学定期：1か月 13,680円 / 3か月 38,990円 / 6か月 73,880円
  - 受託手荷物（三辺の和200cm以下・30kg以下）：1個 210円
  - 自転車・小児用の車等の軽車両：1台 320円
  - 原動機付自転車（125cc以下）：1台 640円
  - 二輪の自動車（0.75L未満）：1台 960円
  - 二輪の自動車（0.75L以上）：1台 1,280円
  - 自動車航送運賃（片道）：3m未満 3,090円〜12m以上は1mごとに加算
  - 大人同伴の小学校就学前の幼児は大人1人につき1人まで無料
notes:
  - 所要時間：フェリー「おおしま」で約25分、旅客船「しおかぜ」で約15分
  - 神湊発：第1便・第2便・第4便・第6便・第7便はフェリー「おおしま」、第3便・第5便は旅客船「しおかぜ」
  - 大島発：第1便・第2便・第4便・第6便・第7便はフェリー「おおしま」、第3便・第5便は旅客船「しおかぜ」
  - 地島航路のフェリー就航日（第2・第4水曜日）の大島航路・第2便は、しおかぜで運航
  - しおかぜは、大きな荷物・車・バイクの航送不可
  - 乗船の予約不可（先着順）
  - 就航船は変更になる場合あり
  - 車両航送は予約必要。大島渡船ターミナル（電話 0940-72-2535、受付 7:00〜17:00）まで
  - 乗客の人数・船舶の都合により全便フェリーでの運航となる場合あり
  - お支払いは現金のみ
  - 悪天候時は欠航となる場合あり。最新の運航状況は「九州のりものinfo.com」で確認
