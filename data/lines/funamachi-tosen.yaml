notes:
  - 大阪市営渡船（無料）
  - 鶴町1丁目〜船町1丁目（岸壁間75m）を結ぶ
  - 対岸まで所要約1〜5分・乗船次第出航
  - 1月1日〜1月3日休航
  - 荒天時運航中止の場合あり
  - 鶴町側発着所：大阪市大正区鶴町1丁目16-61
  - 船町側発着所：大阪市大正区船町1丁目3-117
  - 詰所電話（鶴町側）：06-6551-6158
  - 運航管理：建設局西部方面管理事務所河川・渡船管理事務所 06-6536-5295
  - 1日平均利用者数 約175人（令和6年度）
