notes:
  - 東山ガーデン株式会社「クルーズ名古屋」運営（電話 052-659-6777、営業時間 9:30〜17:30）
  - 主に土日祝に運航。2月は冬季運休、運航カレンダーは公式サイト参照
  - 運航ダイヤは 2026 年 4 月 18 日（土）以降の定期便
  - ささしまライブ〜ガーデンふ頭はコメット／清正、ガーデンふ頭〜メグラスガーデン〜金城ふ頭はガーデン1で乗り換え（待機時間あり）
  - ささしま周遊（ささしまライブ発着・約30分）は 2026 年 6 月より清正で運航開始予定
  - 予約は公式サイトから。15 名以上 1 割引、障害者および介護者 5 割引、未就学児は大人 1 名につき 1 名無料
